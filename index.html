  function submitAdd(form){
    var err = document.getElementById("formErr");
    var fd = new FormData(form);
    var cat = String(fd.get("cat") || "");
    var amount = parseAmount(fd.get("amount"));
    var due = String(fd.get("due") || "");
    var note = String(fd.get("note") || "").trim();
    var repeat = String(fd.get("repeat") || "once");
    var sub = cat === "fatura" ? String(fd.get("sub") || "") : "";
    if (cat === "fatura" && !sub) sub = guessBillSub(note);

    if (!CATS[cat] || !Number.isFinite(amount) || !due || !isValidISODate(due)){
      err.textContent = "Kategori, geçerli bir tutar ve vade girmelisin.";
      err.hidden = false;
      return;
    }
    err.hidden = true;
    var isLate = parseISO(due) < todayMid();
    var status = isLate ? "late" : "wait";
    if (editId){
      var p = byId(editId);
      if (p){
        p.cat = cat; p.amount = amount; p.due = due;
        p.note = note;
        p.sub = sub;
        p.repeat = repeat;
        p.dueDay = repeat === "monthly" ? parseISO(due).getDate() : undefined;
        if (p.status !== "done") p.status = status;
      }
      toast("Ödeme güncellendi");
    } else {
      payments.push({ id:Date.now(), cat:cat, amount:amount, due:due, status:status, note:note, sub:sub, repeat:repeat, dueDay: repeat === "monthly" ? parseISO(due).getDate() : undefined });
      toast("Ödeme eklendi"); Sound.play("add");
    }
    save();
    closeSheet();
    var d = parseISO(due);
    month = d.getMonth(); year = d.getFullYear(); filter = "all"; tab = "pay";
    render();
  }

  /* ---------- Data I/O ---------- */
  function backupFileName(ts){
    var d = new Date(Number(ts) || Date.now());
    return "odeme-takip-yedek-" + d.getFullYear() + "-" + pad(d.getMonth()+1) + "-" + pad(d.getDate()) + "-" + pad(d.getHours()) + pad(d.getMinutes()) + ".json";
  }
  function exportJSON(){
    try {
      var blob = new Blob([JSON.stringify({ version:1, exportedAt:new Date().toISOString(), billTypes:settings.billTypes || [], payments:payments }, null, 2)], { type:"application/json" });
      var url = URL.createObjectURL(blob);
      var a = document.createElement("a");
      a.href = url; a.download = backupFileName(Date.now());
      document.body.appendChild(a); a.click(); a.remove();
      setTimeout(function(){ URL.revokeObjectURL(url); }, 1000);
      toast("Yedek indirildi");
    } catch(e){ toast("Dışa aktarma başarısız"); }
  }

  function validateImportedPayments(data){
    /* Geriye dönük uyumlu: dizi, {payments:[...]} veya {version:1,payments:[...]} kabul.
       Eksik alanlar varsayılanla doldurulur; kurtarılamayan satırlar atlanır (çökmek yerine). */
    if (!data || typeof data !== "object") throw new Error("bad-list");
    if (!Array.isArray(data) && data.version != null && data.version !== 1) throw new Error("unsupported-version");
    var list = Array.isArray(data) ? data : data.payments;
    if (!Array.isArray(list)) throw new Error("bad-list");
    var seen = {}, skipped = 0, out = [];
    list.forEach(function(p, i){
      if (!p || typeof p !== "object"){ skipped += 1; return; }
      var amount = parseAmount(p.amount);
      if (!Number.isFinite(amount) || !isValidISODate(p.due)){ skipped += 1; return; }
      /* Tekrarlanan ID'ler byId()'in yanlış kaydı bulmasına yol açar; yeniden numaralandır. */
      var id = Number(p.id);
      if (!Number.isFinite(id) || seen[id]) id = Date.now() + i;
      while (seen[id]) id += 1;
      seen[id] = 1;
      var repeat = p.repeat === "monthly" ? "monthly" : "once";
      var item = {
        id:id,
        cat: CATS[p.cat] ? p.cat : "diger",
        amount:amount,
        due:p.due,
        status: ["done","wait","late"].indexOf(p.status) !== -1 ? p.status : "wait",
        note: p.note == null ? "" : String(p.note),
        sub: p.sub == null ? "" : String(p.sub),
        repeat:repeat
      };
      if (repeat === "monthly" && Number.isInteger(p.dueDay) && p.dueDay >= 1 && p.dueDay <= 31) item.dueDay = p.dueDay;
      out.push(item);
    });
    return { list: out, skipped: skipped };
  }
  function importJSON(file){
    var r = new FileReader();
    r.onload = function(){
      var data = null, result = null;
      try {
        /* Baştaki BOM'u temizle: JSON.parse BOM'u sevmez. */
        data = JSON.parse(String(r.result).replace(/^\uFEFF/, ""));
        result = validateImportedPayments(data);
      } catch(e){
        var reason = e && e.message === "unsupported-version" ? "Bu yedek daha yeni bir uygulama sürümüne ait"
                   : e && e.message === "bad-list" ? "Yedek dosyası tanınamadı"
                   : "Geçersiz yedek dosyası";
        toast(reason); Sound.play("error"); return;
      }
      var imported = result.list, skipped = result.skipped;
      if (!imported.length && !confirm("Bu yedek boş. Mevcut tüm ödemelerin yerini boş listeyle değiştirmek istiyor musunuz?")) return;
      /* Yedekle gelen özel fatura türlerini ekle (aynı koda sahip olanlar atlanır). */
      if (data && Array.isArray(data.billTypes)){
        try {
          var added = false;
          data.billTypes.forEach(function(t){
            if (!t || typeof t.k !== "string" || !t.k || typeof t.label !== "string" || !t.label) return;
            var exists = (settings.billTypes || []).some(function(x){ return x.k === t.k; });
            if (!exists){
              settings.billTypes = (settings.billTypes || []).concat([{ k:t.k, label:t.label, ico:t.ico || "🧾", bg:t.bg || "rgba(34,211,238,.16)" }]);
              added = true;
            }
          });
          if (added) saveSettings();
        } catch(e){}
      }
      var commit = function(){
        var previous = payments;
        payments = imported;
        applyOverdue();
        if (!save()){ payments = previous; return; }
        render(); closeSheet();
        toast(skipped ? ("Veriler içe aktarıldı · " + skipped + " kayıt atlandı") : "Veriler içe aktarıldı");
        Sound.play("backup");
      };
      saveBackupSnapshot(Date.now()).then(commit).catch(function(){
        if (confirm("Mevcut verilerin cihaz içi yedeği oluşturulamadı. Yine de içe aktarmak istiyor musunuz?")) commit();
      });
    };
    r.onerror = function(){ toast("Dosya okunamadı"); };
    r.readAsText(file);
  }

  /* ---------- Backup ---------- */
  function doBackup(){
    var ts = Date.now();
    var button = document.getElementById("backupNowBtn");
    if (button){ button.disabled = true; button.textContent = "Yedekleniyor…"; }
    try {
      var date = new Date(ts);
      var blob = new Blob([JSON.stringify({ version:1, exportedAt:date.toISOString(), billTypes:settings.billTypes || [], payments:payments }, null, 2)], { type:"application/json" });
      var url = URL.createObjectURL(blob);
      var a = document.createElement("a");
      a.href = url; a.download = backupFileName(ts);
      document.body.appendChild(a); a.click(); a.remove();
      setTimeout(function(){ URL.revokeObjectURL(url); }, 1000);
    } catch(e){
      if (button){ button.disabled = false; button.textContent = "Yedekle"; }
      toast("Yedek dosyası oluşturulamadı"); Sound.play("error");
      return;
    }
    saveBackupSnapshot(ts).then(function(){
      settings.lastBackup = ts;
      saveSettings();
      refreshLastBackup();
      if (button){ button.disabled = false; button.textContent = "Yedekle"; }
      Sound.play("backup");
      toast("Yedek oluşturuldu · " + new Date(ts).toLocaleTimeString("tr-TR", {hour:"2-digit",minute:"2-digit"}));
    }).catch(function(){
      /* Dosya indirildi ama cihaz içi kopya oluşmadı: lastBackup ilerletilmez,
         otomatik yedekleme bir sonraki açılışta tekrar dener. */
      if (button){ button.disabled = false; button.textContent = "Yedekle"; }
      toast("Yedek dosyası indirildi; cihaz içi kopya oluşturulamadı");
      Sound.play("error");
    });
  }

  /* "Son yedek" satırını yeniden çizmeden günceller (yedek alınınca eski tarih kalıyordu) */
  function lastBackupText(){
    return settings.lastBackup ? new Date(settings.lastBackup).toLocaleString("tr-TR") : "—";
  }
  function refreshLastBackup(){
    var el = document.getElementById("lastBackupVal");
    if (el) el.textContent = lastBackupText();
  }

  function checkAutoBackup(){
    if (settings.backupInterval === "off") return;
    var map = { daily:86400000, weekly:7*86400000, monthly:30*86400000 };
    var interval = map[settings.backupInterval];
    if (!interval) return;
    if (!settings.lastBackup || (Date.now() - settings.lastBackup) >= interval){
      var backupTs = Date.now();
      saveBackupSnapshot(backupTs).then(function(){
        settings.lastBackup = backupTs;
        saveSettings();
        refreshLastBackup();
      }).catch(function(){});
    }
  }

  /* ---------- Notifications ---------- */
  function requestNotif(){
    if (!("Notification" in window)){ toast("Bu tarayıcı bildirimi desteklemiyor"); return; }
    Notification.requestPermission().then(function(perm){
      if (perm === "granted"){ toast("Bildirimler açıldı"); checkReminders(true); }
      else { toast("Bildirim izni verilmedi"); }
      render();
    });
  }

  function checkReminders(force){
    if (!("Notification" in window) || Notification.permission !== "granted") return;
    var t = todayMid();
    var days = settings.notifyDays || 3;
    var OVERDUE_WINDOW = 60; /* gün: çok eski gecikmiş kayıtlar uygulamada görünür ama bildirim üretmez */
    var soon = payments.filter(function(p){
      if (p.status === "done") return false;
      var diff = Math.round((parseISO(p.due) - t) / 86400000);
      if (diff < 0) return diff >= -OVERDUE_WINDOW;
      return diff <= days;
    });
    if (!soon.length) return;
    var dayKey = "odeme-takip-notified";
    var last = null;
    try { last = localStorage.getItem(dayKey); } catch(e){}
    var stamp = new Date().toDateString();
    if (!force && last === stamp) return;
    /* Uygulama ekrandayken sistem bildirimi rahatsız etmesin; zil ve "Yaklaşan
       Ödemeler" bölümü bilgiyi zaten gösterir. Arkaya alınınca tekrar denenir. */
    if (!force && document.visibilityState === "visible") return;
    try { localStorage.setItem(dayKey, stamp); } catch(e){}
    var overdue = soon.filter(function(p){ return parseISO(p.due) < t; }).length;
    var upcoming = soon.length - overdue;
    var body = "";
    if (overdue && upcoming) body = overdue + " gecikmiş, " + upcoming + " yaklaşan ödeme var.";
    else if (overdue) body = overdue + " gecikmiş ödeme var.";
    else body = upcoming + " ödeme " + days + " gün içinde vadeli.";
    showReminderNotification(body);
  }

  function showReminderNotification(body){
    var options = { body:body, lang:"tr", tag:"odeme-takip", renotify:true };
    if (navigator.serviceWorker && navigator.serviceWorker.ready){
      navigator.serviceWorker.ready.then(function(reg){ return reg.showNotification("Ödeme Takip", options); }).catch(function(){
        try { new Notification("Ödeme Takip", options); } catch(e){}
      });
    } else {
      try { new Notification("Ödeme Takip", options); } catch(e){}
    }
  }

  function scheduleReminderCheck(){
    checkReminders(false);
    clearInterval(scheduleReminderCheck.timer);
    scheduleReminderCheck.timer = setInterval(function(){ checkReminders(false); }, 15 * 60 * 1000);
  }

  /* ---------- PWA ---------- */
  var deferredPrompt = null;
  var installBtn = document.getElementById("installBtn");

  window.addEventListener("beforeinstallprompt", function(e){
    e.preventDefault();
    deferredPrompt = e;
    installBtn.classList.add("on");
  });
  window.addEventListener("appinstalled", function(){
    deferredPrompt = null;
    installBtn.classList.remove("on");
    toast("Uygulama yüklendi");
  });

  function doInstall(){
    if (deferredPrompt){
      deferredPrompt.prompt();
      deferredPrompt.userChoice.then(function(){ deferredPrompt = null; installBtn.classList.remove("on"); });
    } else {
      toast("Tarayıcı menüsünden 'Uygulamayı yükle' seçeneğini kullan");
    }
  }
  installBtn.addEventListener("click", doInstall);

  function isStandalone(){
    return (window.matchMedia && window.matchMedia("(display-mode: standalone)").matches) || window.navigator.standalone === true;
  }
  function isIOS(){
    var ua = window.navigator.userAgent || "";
    return /iPad|iPhone|iPod/.test(ua) || (ua.indexOf("Macintosh") > -1 && "ontouchend" in document);
  }
  (function iosHint(){
    var dismissed = false;
    try { dismissed = localStorage.getItem("odeme-takip-ios-hint") === "1"; } catch(e){}
    if (isIOS() && !isStandalone() && !dismissed){
      document.getElementById("iosBanner").classList.add("on");
    }
  })();
  document.getElementById("iosClose").addEventListener("click", function(){
    document.getElementById("iosBanner").classList.remove("on");
    try { localStorage.setItem("odeme-takip-ios-hint", "1"); } catch(e){}
  });

  /* ---------- Güncelleme: otomatik etkinleştir + görünür "Yenile" bandı ---------- */
  var swReg = null;
  function showUpdateBanner(){
    var b = document.getElementById("updateBanner");
    if (b) b.classList.add("on");
  }
  /* Sürüm denetimi: GitHub Pages ~10 dk CDN önbelleği ve tarayıcı önbelleği yüzünden
     eski sürümde kalan istemcileri, önbelleği atlayan bir istekle yeni sürüme taşır. */
  function checkDeployedVersion(){
    var CHECK_KEY = "odeme-takip-version";
    var attempted = null;
    try { attempted = sessionStorage.getItem(CHECK_KEY); } catch(e){}
    fetch("./version.json?cb=" + Date.now(), { cache: "no-store" })
      .then(function(r){ return r.ok ? r.json() : null; })
      .then(function(v){
        if (!v || !v.v || v.v === VERSION || v.v === attempted) return;
        try { sessionStorage.setItem(CHECK_KEY, v.v); } catch(e){}
        /* Yeni sorgu tarayıcı önbelleğini atlar; servis çalışanı varsa ağdan tazelenir. */
        location.replace(location.pathname + "?v=" + encodeURIComponent(v.v) + location.hash);
      })
      .catch(function(){});
  }
  function checkForUpdate(){
    if (!swReg || !swReg.update){ toast("Güncelleme servisi kullanılamıyor"); return; }
    swReg.update().then(function(){
      if (swReg.installing || swReg.waiting) toast("Yeni sürüm bulundu, hazırlanıyor…");
      else toast("Uygulama güncel");
    }).catch(function(){ toast("Güncelleme denetlenemedi"); });
  }
  /* Servis çalışanını ve önbellekleri sıfırlar (kayıtlar/ayarlar silinmez), sonra yeniler. */
  function clearCacheAndReload(){
    var tasks = [];
    try {
      if (navigator.serviceWorker && navigator.serviceWorker.getRegistrations){
        tasks.push(navigator.serviceWorker.getRegistrations().then(function(regs){
          return Promise.all(regs.map(function(r){ return r.unregister(); }));
        }));
      }
      if (window.caches && caches.keys){
        tasks.push(caches.keys().then(function(keys){
          return Promise.all(keys.map(function(k){ return caches.delete(k); }));
        }));
      }
    } catch(e){}
    Promise.all(tasks).catch(function(){}).then(function(){ location.reload(); });
  }

  if ("serviceWorker" in navigator && location.protocol.indexOf("http") === 0){
    window.addEventListener("load", function(){
      /* Yeni sürüm arka planda etkinleşir; açık form yoksa sayfa kendini yeniler,
         varsa görünür "Yenile" bandı gösterilir (kaydedilmemiş veri korunur). */
      var hadController = !!navigator.serviceWorker.controller;
      var reloadedForUpdate = false;
      try { reloadedForUpdate = sessionStorage.getItem("odeme-takip-updated") === "1"; } catch(e){}
      function hasUnsavedForm(){ return !!document.getElementById("addForm"); }
      function reloadForUpdate(){
        try { sessionStorage.setItem("odeme-takip-updated", "1"); } catch(e){}
        location.reload();
      }
      function handleUpdateReady(worker){
        if (!navigator.serviceWorker.controller) return;
        if (hasUnsavedForm()){ showUpdateBanner(); return; }
        if (worker && worker.state !== "activated"){ try { worker.postMessage({ type:"SKIP_WAITING" }); } catch(e){} }
      }
      navigator.serviceWorker.register("./sw.js", { scope: "./", updateViaCache: "none" }).then(function(reg){
        swReg = reg;
        if (reg.waiting) handleUpdateReady(reg.waiting);
        reg.addEventListener("updatefound", function(){
          var worker = reg.installing;
          if (!worker) return;
          worker.addEventListener("statechange", function(){
            if (worker.state === "installed") handleUpdateReady(reg.waiting || worker);
          });
        });
        document.addEventListener("visibilitychange", function(){ if (!document.hidden){ try { reg.update(); } catch(e){} } });
        window.addEventListener("focus", function(){ try { reg.update(); } catch(e){} });
        setInterval(function(){ try { reg.update(); } catch(e){} }, 15 * 60 * 1000);
      }).catch(function(){});
      navigator.serviceWorker.addEventListener("controllerchange", function(){
        if (hadController){
          if (hasUnsavedForm()) showUpdateBanner();
          else if (!reloadedForUpdate) reloadForUpdate();
        }
        hadController = true;
      });
      var reloadBtn = document.getElementById("updateReloadBtn");
      if (reloadBtn) reloadBtn.addEventListener("click", function(){ location.reload(); });
    });
  }
  window.addEventListener("focus", function(){ if (appStarted) checkReminders(false); });
  document.addEventListener("visibilitychange", function(){ if (!document.hidden && appStarted) checkReminders(false); });

  /* Simgeler (apple-touch-icon.png, icon-192.png, icon-512.png) dosya olarak sunulur */

  /* ---------- Init ---------- */

  function applyTheme(theme){
    var light = theme === "light";
    document.body.classList.toggle("light-theme", light);
    var meta = document.querySelector('meta[name="theme-color"]');
    if (meta) meta.setAttribute("content", light ? "#f4f7fb" : "#070b16");
    var icon = document.getElementById("themeIcon");
    var btn = document.getElementById("themeToggle");
    if (icon) icon.textContent = light ? "🌙" : "☀️";
    if (btn){
      btn.title = light ? "Koyu temaya geç" : "Açık temaya geç";
      btn.setAttribute("aria-label", light ? "Koyu temaya geç" : "Açık temaya geç");
    }
  }

  function setupTheme(){
    var saved = "dark";
    try{ saved = localStorage.getItem("odeme-takip-theme") || "dark"; }catch(e){}
    applyTheme(saved);
    var btn = document.getElementById("themeToggle");
    if (btn){
      btn.addEventListener("click", function(){
        var next = document.body.classList.contains("light-theme") ? "dark" : "light";
        applyTheme(next);
        try{ localStorage.setItem("odeme-takip-theme", next); }catch(e){}
      });
    }
  }

  function startApp(){
    if (appStarted) return;
    appStarted = true;

    /* Ana ekran kısayolları: ./?action=add (yeni ödeme) ve ./?tab=sum (özet) */
    var wantAdd = false;
    try {
      var q = new URLSearchParams(location.search);
      if (TAB_ORDER.indexOf(q.get("tab")) !== -1) tab = q.get("tab");
      wantAdd = q.get("action") === "add";
      /* Sürüm parametresini (?v=...) adres çubuğundan temizle. */
      if (q.get("v")){
        var params = new URLSearchParams(location.search);
        params.delete("v");
        var qs = params.toString();
        try { history.replaceState(null, "", location.pathname + (qs ? "?" + qs : "") + location.hash); } catch(e){}
      }
    } catch(e){}
    load().then(function(){
      render();
      if (wantAdd) openSheet("add");
      scheduleReminderCheck();
      checkAutoBackup();
      if (settings.fx !== false) fetchUSDTRY();
    });
  }

  var fxBtn = document.getElementById("fxRate");
  if (fxBtn) fxBtn.addEventListener("click", fetchUSDTRY);

  loadSettings();
  applyMotionSetting();
  setupTheme();
  loadCachedFx();
  if (lastFx !== null){
    var fxValEl = document.getElementById("fxValue");
    if (fxValEl) fxValEl.textContent = fmtFx(lastFx);
  }
  applyFxVisibility();
  checkDeployedVersion();
  /* PIN isteğe bağlıdır: yalnızca önceden belirlenmişse kilit ekranı gelir. */
  if (pinSet()){
    showLock("login");
  } else {
    startApp();
  }
})();
</script>
