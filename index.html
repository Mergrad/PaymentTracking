<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
<title>Ödeme Takip · Mobil Finans Asistanı</title>
<meta name="description" content="Kişisel ödemeleri takip eden, çevrimdışı çalışan, verileri sadece cihazda tutan PWA." />
<meta name="theme-color" content="#070b16" />
<meta name="color-scheme" content="dark" />
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; connect-src 'self' https://data-api.binance.vision; object-src 'none'; base-uri 'self'; form-action 'none'" />
<meta name="mobile-web-app-capable" content="yes" />
<meta name="apple-mobile-web-app-capable" content="yes" />
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
<meta name="apple-mobile-web-app-title" content="Ödeme Takip" />
<meta name="format-detection" content="telephone=no" />
<link rel="manifest" href="manifest.json" />
<link rel="apple-touch-icon" href="apple-touch-icon.png" />
<link rel="icon" type="image/png" sizes="192x192" href="icon-192.png" />
<style>
@layer od-layout {
  :where(.od-stack,.od-row,.od-row-top,.od-cluster,.od-grid,.od-field,.od-stat,.od-cell,.od-tile) > :where(*) { min-width: 0; }
  .od-stack   { display: flex; flex-direction: column; gap: var(--od-gap, 8px); }
  .od-row     { display: flex; align-items: center; gap: var(--od-gap, 8px); }
  .od-row-top { display: flex; align-items: flex-start; gap: var(--od-gap, 8px); }
  .od-cluster { display: flex; flex-wrap: wrap; align-items: center; gap: var(--od-gap, 8px); }
  .od-fill    { flex: 1 1 0; min-width: 0; }
  .od-fixed   { flex: none; }
  .od-grid    { display: grid; gap: var(--od-gap, 12px); grid-template-columns: repeat(var(--od-cols, 3), minmax(0, 1fr)); }
  .od-stat, .od-field, .od-cell { display: grid; gap: var(--od-gap, 2px); }
  :where(.od-stat,.od-field,.od-cell) > :where(*) { display: block; }
  .od-tile { display: grid; grid-template-rows: auto 1fr; }
  :where(.od-tile) > :where(*) { display: block; }
  .od-media { display: block; width: 100%; height: auto; aspect-ratio: var(--od-ratio, auto); }
  .od-media-cover { object-fit: cover; }
  .od-truncate { display: block; max-width: 100%; overflow: hidden; white-space: nowrap; text-overflow: ellipsis; }
  .od-clamp-2, .od-clamp-3 { display: -webkit-box; -webkit-box-orient: vertical; overflow: hidden; overflow-wrap: anywhere; }
  .od-clamp-2 { -webkit-line-clamp: 2; }
  .od-clamp-3 { -webkit-line-clamp: 3; }
  .od-lines-2 { min-height: calc(2 * 1.4em); }
  .od-nowrap  { white-space: nowrap; }
  .od-keep    { word-break: keep-all; overflow-wrap: anywhere; }
  .od-screen { display: grid; grid-template-rows: auto minmax(0, 1fr) auto; height: 100%; }
  .od-scroll { overflow-y: auto; overscroll-behavior: contain; min-height: 0; }
  .od-rail { display: flex; gap: var(--od-gap, 8px); overflow-x: auto; scroll-snap-type: x proximity; scrollbar-width: none;
             padding-inline: var(--od-rail-pad, 16px); scroll-padding-inline: var(--od-rail-pad, 16px); }
  .od-rail::-webkit-scrollbar { display: none; }
  :where(.od-rail) > :where(*) { flex: none; scroll-snap-align: start; }
  :where(.od-rail) > :where(:last-child) { margin-inline-end: var(--od-rail-pad, 16px); }
  .od-spacer { flex: none; visibility: hidden; pointer-events: none; }
  .od-touch  { min-width: 44px; min-height: 44px; }
}

:root{
  --bg:#070b16; --bg-2:#0b1224; --outer:#04060d;
  --surface:rgba(255,255,255,.045); --surface-2:rgba(255,255,255,.075);
  --stroke:rgba(255,255,255,.09); --stroke-2:rgba(255,255,255,.16);
  --text:#eef1fb; --muted:#8b93ad; --faint:#7d86a3;
  --violet:#6366f1; --indigo:#7c5cff; --cyan:#22d3ee;
  --green:#34d399; --amber:#fbbf24; --rose:#fb7185; --pink:#f472b6;
  --grad:linear-gradient(135deg,#6366f1 0%,#22d3ee 100%);
  --r-lg:24px; --r-md:18px; --r-sm:12px;
  --shadow:0 18px 45px -18px rgba(0,0,0,.75);
  --safe-b:env(safe-area-inset-bottom,0px); --safe-t:env(safe-area-inset-top,0px);
  --nav-h:66px;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;padding:0}
body{
  font-family:-apple-system,BlinkMacSystemFont,"SF Pro Text","Segoe UI",Roboto,"Helvetica Neue",system-ui,sans-serif;
  background:var(--outer); color:var(--text); min-height:100dvh;
  -webkit-font-smoothing:antialiased; text-rendering:optimizeLegibility;
}
button,input,select{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--cyan);outline-offset:2px;border-radius:8px}

.app{
  position:relative; width:100%; max-width:440px; margin:0 auto;
  min-height:100dvh; overflow-x:hidden;
  background:
    radial-gradient(120% 55% at 8% -5%,rgba(99,102,241,.34),transparent 60%),
    radial-gradient(90% 45% at 100% 0%,rgba(34,211,238,.20),transparent 55%),
    linear-gradient(180deg,var(--bg-2),var(--bg) 38%,#04060d);
  padding-bottom:calc(var(--nav-h) + var(--safe-b) + 24px);
}
.app::before{
  content:"";position:absolute;inset:0;pointer-events:none;
  background:radial-gradient(70% 30% at 50% 110%,rgba(99,102,241,.16),transparent 70%);
}
.view{position:relative;z-index:1}

/* Top bar */
.topbar{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:calc(20px + var(--safe-t)) 20px 8px}
.brand{display:flex;align-items:center;gap:11px;min-width:0;flex:1 1 auto}
.brand > div:last-child{min-width:0}
.logo{width:42px;height:42px;border-radius:14px;display:grid;place-items:center;background:var(--grad);
  box-shadow:0 10px 26px -8px rgba(99,102,241,.85);flex:0 0 auto}
.logo svg{width:22px;height:22px}
.brand h1{font-size:15px;margin:0;font-weight:700;letter-spacing:-.2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.brand p{margin:2px 0 0;font-size:11px;color:var(--muted);font-weight:500;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
@media (max-width:430px){
  .topbar{padding-left:16px;padding-right:16px;gap:8px}
  .brand{gap:9px}
  .logo{width:38px;height:38px;border-radius:13px}
  .logo svg{width:20px;height:20px}
  .fx-rate .fx-unit{display:none}
}
@media (max-width:360px){ .brand p{display:none} }
@media (max-width:340px){ .logo{display:none} .top-actions{gap:6px} }
.top-actions{display:flex;align-items:center;gap:8px;flex:0 0 auto}
.fx-rate{
  --fx-inner:#0f1426;
  display:flex;align-items:center;gap:6px;min-height:44px;padding:0 11px;
  position:relative;overflow:hidden;isolation:isolate;
  border-radius:12px;border:1px solid var(--stroke);background:var(--surface);
  color:var(--text);cursor:pointer;backdrop-filter:blur(14px);white-space:nowrap;box-shadow:none;
}
.fx-rate .fx-symbol{font-size:11px;font-weight:800;color:#c7c9ff;letter-spacing:.2px}
.fx-rate .fx-value{font-size:12px;font-weight:750;letter-spacing:-.2px}
.fx-rate .fx-unit{font-size:9.5px;color:var(--muted);font-weight:650}
.fx-rate.loading .fx-value{color:var(--muted)}
.fx-rate.error .fx-value{color:var(--amber)}

.icon-btn{width:44px;height:44px;border-radius:14px;border:1px solid var(--stroke);background:var(--surface);
  display:grid;place-items:center;color:var(--text);backdrop-filter:blur(14px);transition:transform .18s ease,background .18s ease}
.icon-btn svg{width:19px;height:19px}
.icon-btn:hover{background:var(--surface-2)}
.icon-btn:active{transform:scale(.93)}
.bell{position:relative}
.bell::after{content:"";position:absolute;top:10px;right:11px;width:8px;height:8px;border-radius:50%;
  background:var(--rose);border:2px solid #0b1224}
.bell[data-empty="1"]::after{display:none}
.install-btn{display:none;border:1px solid transparent;background:var(--grad);color:#08101f;font-weight:750;
  font-size:12.5px;padding:0 14px;min-height:44px;border-radius:14px;align-items:center;gap:6px;
  box-shadow:0 10px 24px -10px rgba(99,102,241,.9)}
.install-btn.on{display:inline-flex}
.install-btn:active{transform:scale(.95)}

/* Month bar */
.monthbar{display:flex;align-items:center;justify-content:space-between;margin:14px 20px 4px;padding:8px 10px;
  border-radius:18px;background:var(--surface);border:1px solid var(--stroke);backdrop-filter:blur(16px);
  touch-action:pan-y;user-select:none}
.monthbar .m-btn{width:44px;height:44px;border-radius:12px;border:none;background:transparent;color:var(--muted);
  display:grid;place-items:center;transition:background .18s ease,color .18s ease}
.monthbar .m-btn:hover{background:var(--surface-2);color:var(--text)}
.monthbar .m-btn:active{transform:scale(.94)}
.monthbar .m-btn svg{width:20px;height:20px}
.m-label{display:grid;justify-items:center;line-height:1.2;gap:2px}
.m-label b{font-size:14px;letter-spacing:-.2px}
.m-label span{font-size:10.5px;color:var(--muted);font-weight:500}
.swipe-hint{font-size:9.5px;color:var(--faint);text-align:center;margin:6px 20px 0;font-weight:500}

/* Hero */
.hero{margin:12px 20px 0;padding:18px 20px;border-radius:var(--r-lg);position:relative;overflow:hidden;
  background:linear-gradient(160deg,rgba(99,102,241,.26),rgba(34,211,238,.10) 60%,rgba(255,255,255,.03));
  border:1px solid var(--stroke-2);box-shadow:var(--shadow)}
.hero::after{content:"";position:absolute;top:-60px;right:-50px;width:170px;height:170px;border-radius:50%;
  background:radial-gradient(circle,rgba(99,102,241,.55),transparent 70%);filter:blur(6px);pointer-events:none}
.hero-top{display:flex;align-items:flex-start;justify-content:space-between;gap:12px;position:relative}
.eyebrow{font-size:11.5px;color:#c7c9ff;font-weight:650;letter-spacing:.5px;text-transform:uppercase}
.total{font-size:34px;font-weight:800;letter-spacing:-1.4px;margin:8px 0 2px;line-height:1.05;
  background:linear-gradient(120deg,#fff,#c7c9ff);-webkit-background-clip:text;background-clip:text;color:transparent}
.sub{font-size:12px;color:var(--muted);font-weight:500}
.ring{width:78px;height:78px;position:relative;flex:0 0 auto}
.ring svg{transform:rotate(-90deg)}
.ring .pct{position:absolute;inset:0;display:grid;place-items:center;font-size:15px;font-weight:800;letter-spacing:-.5px}
.stats{display:flex;gap:10px;margin-top:14px;position:relative}
.stat{flex:1 1 0;min-width:0;border-radius:16px;padding:12px;background:rgba(4,6,13,.42);
  border:1px solid var(--stroke);backdrop-filter:blur(10px);display:grid;gap:5px}
.stat .k{display:flex;align-items:center;gap:6px;font-size:10.5px;color:var(--muted);font-weight:600}
.stat .k i{width:7px;height:7px;border-radius:2px;display:inline-block;flex:0 0 auto}
.stat .v{font-size:14.5px;font-weight:750;letter-spacing:-.4px}

/* Alert */
.alert{margin:16px 20px 0;padding:14px 16px;border-radius:var(--r-md);display:flex;align-items:center;gap:13px;
  background:linear-gradient(120deg,rgba(251,113,133,.20),rgba(251,113,133,.06));border:1px solid rgba(251,113,133,.38)}
.alert[hidden]{display:none}
.a-ico{width:38px;height:38px;border-radius:12px;background:rgba(251,113,133,.18);display:grid;place-items:center;
  color:var(--rose);flex:0 0 auto}
.a-ico svg{width:19px;height:19px}
.alert .a-text{min-width:0}
.alert b{display:block;font-size:13.5px;font-weight:700}
.alert span{font-size:11.5px;color:#f6bcc4;font-weight:500}
.go{margin-left:auto;border:none;background:var(--rose);color:#3a0d16;font-weight:750;font-size:12px;
  padding:0 14px;min-height:40px;border-radius:12px;flex:0 0 auto;transition:transform .18s ease}
.go:active{transform:scale(.95)}

/* Section head */
.sec-head{display:flex;align-items:center;justify-content:space-between;gap:10px;margin:24px 20px 12px}
.sec-head h2{font-size:16px;margin:0;font-weight:750;letter-spacing:-.3px}
.count{font-size:11px;font-weight:700;color:#c7c9ff;background:rgba(99,102,241,.18);
  border:1px solid rgba(99,102,241,.32);padding:4px 10px;border-radius:999px;white-space:nowrap}

/* Chips */
.filters{display:flex;gap:8px;padding:0 20px 4px;overflow-x:auto;scrollbar-width:none}
.filters::-webkit-scrollbar{display:none}
.chip{flex:0 0 auto;border:1px solid var(--stroke);background:var(--surface);color:var(--muted);font-size:12.5px;
  font-weight:650;padding:0 15px;min-height:40px;border-radius:999px;transition:.2s;white-space:nowrap;
  backdrop-filter:blur(12px)}
.chip:hover{color:var(--text)}
.chip:active{transform:scale(.95)}
.chip.active{background:var(--grad);color:#08101f;border-color:transparent;box-shadow:0 10px 24px -10px rgba(99,102,241,.9)}

/* Payment list */
.list{display:flex;flex-direction:column;gap:12px;padding:16px 20px 88px}
.pay{position:relative;display:grid;grid-template-columns:44px minmax(0,1fr);column-gap:13px;row-gap:0;padding:15px 15px 15px 18px;border-radius:var(--r-md);
  background:var(--surface);border:1px solid var(--stroke);backdrop-filter:blur(16px);overflow:hidden;
  animation:rise .4s cubic-bezier(.2,.8,.2,1) both;cursor:pointer}
.pay::before{content:"";position:absolute;left:0;top:14px;bottom:14px;width:3px;border-radius:3px;
  background:var(--accent,var(--indigo));opacity:.95}
/* Ödenmiş kart: tüm kartı şeffaflaştırmak yerine yalnızca vurguyu azalt (metin kontrastı korunur) */
.pay.done::before{opacity:.45}
.pay.done .p-ico{opacity:.7}
.pay.done .p-cat,.pay.done .amt{color:var(--muted)}
@keyframes rise{from{opacity:0;transform:translateY(12px)}to{opacity:1;transform:none}}
.p-ico{width:44px;height:44px;border-radius:14px;flex:0 0 auto;display:grid;place-items:center;
  background:color-mix(in srgb,var(--accent) 16%,transparent);color:var(--accent);
  border:1px solid color-mix(in srgb,var(--accent) 32%,transparent)}
.p-ico svg{width:21px;height:21px}
.p-body{flex:1 1 0;min-width:0}
.p-row1{display:flex;align-items:flex-start;justify-content:space-between;gap:8px}
.p-cat{font-size:14.5px;font-weight:700;letter-spacing:-.2px;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.amt{font-size:15px;font-weight:800;letter-spacing:-.4px}
.p-row2{display:flex;align-items:center;gap:8px;margin-top:4px;flex-wrap:nowrap;min-width:0}
.due{font-size:11.5px;color:var(--muted);font-weight:550;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.p-row2 .badge{flex:none}
.p-note{font-size:11.5px;color:var(--faint);margin-top:7px;line-height:1.4;overflow-wrap:anywhere}
.p-note:empty{display:none}
.badge{font-size:10px;font-weight:750;padding:4px 9px;border-radius:999px;letter-spacing:.2px;border:1px solid transparent;white-space:nowrap}
.badge.ok{color:var(--green);background:rgba(52,211,153,.13);border-color:rgba(52,211,153,.3)}
.badge.wait{color:var(--amber);background:rgba(251,191,36,.13);border-color:rgba(251,191,36,.3)}
.badge.late{color:var(--rose);background:rgba(251,113,133,.15);border-color:rgba(251,113,133,.35)}
.p-actions{grid-column:1 / -1;display:flex;gap:6px;margin-top:12px;flex-wrap:wrap;align-items:center}
.p-actions button{border:1px solid var(--stroke-2);background:var(--surface-2);color:var(--text);font-size:11.5px;
  font-weight:650;padding:0 10px;min-height:44px;border-radius:11px;transition:transform .16s ease,background .16s ease}
.p-actions .icon{min-width:44px;padding:0;display:grid;place-items:center}
.p-actions .icon svg{width:18px;height:18px}
.p-actions .push{margin-left:auto}
.p-actions .icon-danger{color:#fda4af;border-color:rgba(251,113,133,.3)}
.p-actions .icon-danger:hover{background:rgba(251,113,133,.14);color:#ffd3da}
.p-actions button:hover{background:rgba(255,255,255,.12)}
.p-actions button:active{transform:scale(.95)}
.p-actions .ghost{background:transparent;color:var(--muted);border-color:var(--stroke)}
.p-actions .ghost:hover{color:var(--text)}
.p-actions .primary{background:var(--grad);color:#08101f;border-color:transparent;font-weight:750}

.empty{padding:44px 20px;text-align:center;color:var(--muted)}
.empty .e-ico{width:64px;height:64px;border-radius:20px;margin:0 auto 14px;display:grid;place-items:center;
  background:var(--surface);border:1px solid var(--stroke);color:var(--indigo)}
.empty .e-ico svg{width:28px;height:28px}
.empty b{display:block;font-size:14.5px;color:var(--text);margin-bottom:4px}
.empty span{font-size:12.5px}

/* FAB */
.fab{position:fixed;right:calc(50% - 220px + 20px);bottom:calc(var(--nav-h) + var(--safe-b) + 16px);
  width:56px;height:56px;border-radius:19px;border:none;background:var(--grad);color:#08101f;display:grid;
  place-items:center;box-shadow:0 18px 34px -12px rgba(99,102,241,.95);transition:transform .2s ease;z-index:25}
.fab[hidden]{display:none}
.fab:active{transform:scale(.92) rotate(90deg)}
.fab svg{width:26px;height:26px}
@media (max-width:480px){.fab{right:20px}}

/* Bottom nav */
.navbar{position:fixed;bottom:0;left:50%;transform:translateX(-50%);width:100%;max-width:440px;z-index:30;
  padding:8px 10px calc(8px + var(--safe-b));display:flex;align-items:stretch;justify-content:space-around;
  background:linear-gradient(180deg,rgba(7,11,22,.6),rgba(7,11,22,.96) 45%);backdrop-filter:blur(22px);
  border-top:1px solid var(--stroke)}
.nav-item{border:none;background:transparent;color:var(--faint);display:flex;flex-direction:column;align-items:center;
  justify-content:center;gap:4px;font-size:10.5px;font-weight:650;min-height:48px;min-width:44px;padding:6px 4px;
  border-radius:14px;transition:color .2s ease,transform .16s ease;flex:1 1 0;white-space:nowrap}
.nav-item svg{width:22px;height:22px}
.nav-item.active{color:#c7c9ff}
.nav-item.active svg{filter:drop-shadow(0 0 8px rgba(99,102,241,.9))}
.nav-item:active{transform:scale(.94)}

/* Cards / pages */
.page{padding:16px 20px 0}
.card{background:var(--surface);border:1px solid var(--stroke);border-radius:var(--r-md);padding:18px;
  backdrop-filter:blur(16px)}
.card + .card{margin-top:12px}
.card h3{margin:0 0 14px;font-size:14px;font-weight:750;letter-spacing:-.2px}
.kv{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:11px 0;border-top:1px solid var(--stroke)}
.kv:first-of-type{border-top:none}
.kv .k{font-size:12.5px;color:var(--muted);font-weight:550}
.kv .v{font-size:13.5px;font-weight:750}

/* Modern square category map shared by Summary and Annual views */
.donut-wrap{display:grid;grid-template-columns:minmax(0,1fr);justify-items:center;gap:12px;margin:2px 0 18px}
.donut{position:relative;width:min(100%,320px);aspect-ratio:1/1;display:block;isolation:isolate}
.square-map{width:100%;height:100%;display:grid;grid-template-columns:repeat(3,minmax(0,1fr));grid-template-rows:repeat(3,minmax(0,1fr));gap:7px;padding:2px;}
.square-tile{position:relative;display:flex;flex-direction:column;align-items:flex-start;justify-content:space-between;gap:5px;min-width:0;min-height:0;padding:clamp(7px,2.4vw,13px);border:1px solid color-mix(in srgb,var(--tile-color) 45%,transparent);border-radius:16px;color:#fff;text-align:left;overflow:hidden;cursor:pointer;background:linear-gradient(145deg,color-mix(in srgb,var(--tile-color) 90%,white 7%),color-mix(in srgb,var(--tile-color) 64%,#111827 36%));box-shadow:inset 0 1px 0 rgba(255,255,255,.18),0 7px 18px -14px var(--tile-color);transition:transform .2s ease,filter .2s ease,opacity .2s ease,box-shadow .2s ease;animation:tileIn .48s both;animation-delay:var(--d,0ms)}
.square-tile:hover,.square-tile.sel{transform:translateY(-2px) scale(.985);filter:saturate(1.12);box-shadow:inset 0 1px 0 rgba(255,255,255,.22),0 8px 22px -10px var(--tile-color)}
.square-tile .tile-name{font-size:clamp(10px,2.8vw,12px);font-weight:800;line-height:1.2;overflow-wrap:anywhere;max-width:100%;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.square-tile .tile-pct{font-size:clamp(15px,4.2vw,21px);font-weight:900;letter-spacing:-.6px;line-height:1}
.square-tile .tile-mark{width:20px;height:3px;border-radius:99px;background:rgba(255,255,255,.68);box-shadow:0 0 12px rgba(255,255,255,.3)}
.square-map.has-sel .square-tile:not(.sel){opacity:.38;filter:saturate(.65)}
.dn-center{display:flex;align-items:center;justify-content:center;gap:6px;flex-wrap:wrap;text-align:center;color:var(--muted);font-size:12px;margin-top:2px}
.dn-center .l{font-weight:650}.dn-center .v{font-weight:850;font-size:15px;color:var(--text);letter-spacing:-.3px}
.category-chart{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px;padding-top:3px}
.cat-row{display:grid;align-content:start;gap:11px;min-width:0;padding:13px;border:1px solid var(--stroke);border-radius:16px;background:linear-gradient(145deg,var(--surface-2),transparent);transition:border-color .18s ease,background .18s ease,transform .18s ease;cursor:pointer}
.cat-row:hover{border-color:var(--cat-color);transform:translateY(-1px)}
.cat-row.sel{border-color:var(--cat-color);background:rgba(99,102,241,.08);box-shadow:0 8px 24px -20px var(--cat-color)}
.cat-top{display:flex;flex-direction:column;align-items:stretch;gap:9px;min-width:0}
.cat-name{display:flex;align-items:center;gap:8px;min-width:0}
.cat-top .dot{width:10px;height:10px;border-radius:4px;flex:0 0 auto;box-shadow:0 0 0 4px color-mix(in srgb,var(--cat-color) 13%,transparent)}
.cat-top .nm{font-size:12px;font-weight:750;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.cat-value{display:flex;align-items:baseline;justify-content:space-between;gap:5px;white-space:nowrap;min-width:0}
.cat-top .vl{font-size:clamp(12px,3.4vw,14px);font-weight:850;letter-spacing:-.35px;overflow:hidden;text-overflow:ellipsis}
.cat-top .pc{font-size:10.5px;color:var(--muted);font-weight:750;flex:0 0 auto}
.cat-bar{height:5px;border-radius:999px;background:rgba(148,163,184,.16);overflow:hidden}
.cat-bar span{display:block;height:100%;border-radius:999px;transition:width .6s cubic-bezier(.2,.8,.2,1);box-shadow:0 0 14px color-mix(in srgb,var(--cat-color) 55%,transparent)}
@keyframes tileIn{from{opacity:0;transform:translateY(7px) scale(.96)}to{opacity:1;transform:translateY(0) scale(1)}}
body.light-theme .square-tile{color:#fff;box-shadow:inset 0 1px 0 rgba(255,255,255,.28),0 7px 18px -14px var(--tile-color)}
body.light-theme .cat-row{background:linear-gradient(145deg,rgba(255,255,255,.96),rgba(248,250,252,.72));box-shadow:0 6px 18px -18px rgba(15,23,42,.4)}
/* Tüm Zamanlar: horizontal category bars keep large amounts readable */
.alltime-category-bars{grid-template-columns:1fr;gap:12px}
.alltime-category-bars .alltime-cat-row{display:grid;grid-template-columns:minmax(0,1fr);gap:8px;padding:13px 14px;border-radius:14px;cursor:default}
.alltime-cat-row .alltime-cat-head{display:grid;grid-template-columns:minmax(0,1fr) auto;align-items:start;gap:10px}
.alltime-cat-row .alltime-cat-name{display:flex;align-items:center;gap:9px;min-width:0;font-size:13px;font-weight:750;overflow-wrap:anywhere}
.alltime-cat-row .alltime-cat-amount{font-size:clamp(11px,3.1vw,13px);font-weight:850;text-align:right;max-width:52vw;overflow-wrap:anywhere;line-height:1.3}
.alltime-cat-row .alltime-cat-meta{font-size:11px;color:var(--muted);text-align:right;line-height:1.3}
.alltime-cat-row .alltime-track{height:8px;border-radius:99px;background:var(--surface-2);overflow:hidden}
.alltime-cat-row .alltime-track span{display:block;height:100%;border-radius:99px;transition:width .7s cubic-bezier(.2,.8,.2,1);animation:barIn .65s both}
@keyframes barIn{from{width:0;opacity:.5}to{opacity:1}}
@media(max-width:380px){.square-map{gap:5px}.square-tile{border-radius:12px;padding:7px}.category-chart{grid-template-columns:1fr}.alltime-cat-row .alltime-cat-amount{max-width:48vw}}
@media(prefers-reduced-motion:reduce){.square-tile,.alltime-track span{animation:none!important;transition:none!important}}

.ratio{display:flex;gap:16px;margin-top:12px;flex-wrap:wrap}
.ratio b{display:block;font-size:13px;font-weight:750;margin-top:3px}
.ratio .k{font-size:11px;color:var(--muted);font-weight:600}
.bar-track{display:flex;height:12px;border-radius:999px;overflow:hidden;background:rgba(255,255,255,.06);border:1px solid var(--stroke);margin-top:14px}
.bar-track span{display:block;height:100%}

/* Animated semicircle gauge */
.gauge-wrap{width:100%;max-width:510px;margin:8px auto 16px;display:grid;grid-template-columns:minmax(0,1fr);justify-items:center;gap:8px}
.gauge-svg{display:block;width:min(100%,320px);height:auto;overflow:visible;touch-action:manipulation}
.gauge-needle{transform-box:view-box;transform-origin:100px 100px;transition:transform 1s cubic-bezier(0.4, 0, 0.2, 1);will-change:transform}
.category-overview .category-chart{display:none!important}
.gauge-center{display:flex;flex-direction:column;align-items:center;gap:3px;margin-top:2px;z-index:1;min-height:65px;text-align:center}
.gauge-segment.is-active{opacity:1;filter:drop-shadow(0 0 4px currentColor)}
.gauge-center span{font-size:12px;font-weight:750;color:var(--muted)}.gauge-center strong{font-size:clamp(20px,5vw,29px);font-weight:900;letter-spacing:-.8px;color:var(--text);font-variant-numeric:tabular-nums}.gauge-center small{font-size:11px;color:var(--muted);font-weight:650}
.gauge-cats{width:100%;display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px;margin-top:8px}
.gauge-cat{display:grid;grid-template-columns:10px minmax(0,1fr) auto;align-items:center;gap:8px;min-width:0;padding:10px 11px;border:1px solid var(--stroke);border-radius:12px;background:var(--surface-2);color:var(--text);text-align:left;cursor:pointer;animation:tileIn .4s both;animation-delay:var(--d,0ms);transition:transform .18s,border-color .18s,background .18s}
.gauge-cat i{width:9px;height:9px;border-radius:50%;background:var(--cat-color);box-shadow:0 0 0 3px color-mix(in srgb,var(--cat-color) 16%,transparent)}.gauge-cat span{font-size:12px;font-weight:700;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.gauge-cat b{font-size:12px;font-weight:850;font-variant-numeric:tabular-nums}.gauge-cat.sel{border-color:var(--cat-color);background:color-mix(in srgb,var(--cat-color) 12%,var(--surface));transform:translateY(-1px);box-shadow:0 7px 20px -16px var(--cat-color)}
@keyframes gaugeArcIn{to{stroke-dashoffset:0}}
@media(max-width:380px){.gauge-svg{width:100%;max-width:320px}.gauge-cats{grid-template-columns:1fr}.gauge-center{margin-top:-8px}.gauge-cat{padding:9px 10px}}
@media(prefers-reduced-motion:reduce){.gauge-segment,.gauge-cat{animation:none!important}.gauge-needle{transition:none!important}}

/* Year chart */
.chart{display:flex;align-items:flex-end;gap:5px;height:190px;padding-top:8px}
.ycol{flex:1 1 0;min-width:0;display:flex;flex-direction:column;align-items:center;gap:6px;height:100%;
  background:transparent;border:none;padding:0;border-radius:12px;transition:background .18s ease}
.ycol:hover{background:rgba(255,255,255,.05)}
.ytrack{flex:1 1 auto;width:100%;display:flex;align-items:flex-end;justify-content:center;min-height:0}
.yfill{width:62%;max-width:18px;min-height:4px;border-radius:999px 999px 6px 6px;background:var(--grad);opacity:.85;transition:opacity .18s ease}
.ycol.active .yfill{opacity:1;box-shadow:0 0 14px rgba(99,102,241,.8)}
.ym{font-size:10px;color:var(--muted);font-weight:600}
.ycol.active .ym{color:#c7c9ff}
.yval{font-size:9.5px;color:var(--faint);font-weight:700;min-height:12px;white-space:nowrap;letter-spacing:-.25px}
.ycol.active .yval{color:var(--text)}

/* Settings */
.set-row{display:flex;align-items:center;gap:12px;padding:13px 0;border-top:1px solid var(--stroke)}
.set-row:first-of-type{border-top:none}
.set-row .txt{flex:1 1 0;min-width:0}
.set-row .txt b{display:block;font-size:13.5px;font-weight:700}
.set-row .txt span{display:block;font-size:11.5px;color:var(--muted);margin-top:3px;line-height:1.4}
.set-col{display:grid;gap:8px;padding:13px 0;border-top:1px solid var(--stroke)}
.set-col:first-of-type{border-top:none}
.set-col > .lbl{font-size:12px;font-weight:650;color:var(--muted)}
.seg-set{display:flex;gap:8px}
.seg-set label{flex:1 1 0;display:flex;align-items:center;justify-content:center;min-height:44px;
  border:1px solid var(--stroke-2);border-radius:12px;font-size:12.5px;font-weight:650;color:var(--muted);cursor:pointer;transition:.15s}
.seg-set input{position:absolute;opacity:0;width:0;height:0}
.seg-set label:has(input:checked){color:var(--text);border-color:var(--violet);background:rgba(99,102,241,.16)}
.btn{border:1px solid var(--stroke-2);background:var(--surface-2);color:var(--text);font-size:12px;font-weight:650;
  padding:0 14px;min-height:42px;border-radius:12px;white-space:nowrap;transition:transform .16s ease,background .16s ease}
.btn:hover{background:rgba(255,255,255,.12)}
.btn:active{transform:scale(.95)}
.btn.primary{background:var(--grad);color:#08101f;border-color:transparent;font-weight:750}
.btn.danger{background:rgba(251,113,133,.14);border-color:rgba(251,113,133,.4);color:#ffd3da}
.btn.grad-border{background:transparent;border:1px solid transparent;
  background-image:linear-gradient(var(--bg-2),var(--bg-2)),var(--grad);background-origin:border-box;background-clip:padding-box,border-box}
.hint{font-size:11.5px;color:var(--muted);line-height:1.5;margin:10px 0 0}
.pill-ok{font-size:10.5px;font-weight:700;color:var(--green);background:rgba(52,211,153,.13);
  border:1px solid rgba(52,211,153,.3);padding:4px 9px;border-radius:999px;white-space:nowrap}
.pill-on{font-size:10.5px;font-weight:700;color:#c7c9ff;background:rgba(99,102,241,.16);
  border:1px solid rgba(99,102,241,.32);padding:4px 9px;border-radius:999px;white-space:nowrap}

/* Sheet */
.scrim{position:fixed;inset:0;background:rgba(3,5,11,.66);backdrop-filter:blur(3px);opacity:0;visibility:hidden;
  transition:opacity .22s ease,visibility .22s ease;z-index:40}
.scrim.on{opacity:1;visibility:visible}
.sheet{position:fixed;left:50%;bottom:0;transform:translate(-50%,100%);width:100%;max-width:440px;z-index:50;
  background:linear-gradient(180deg,#0d1425,#080d18);border:1px solid var(--stroke);border-bottom:none;
  border-radius:26px 26px 0 0;padding:10px 20px calc(22px + var(--safe-b));max-height:88dvh;overflow-y:auto;overscroll-behavior:contain;
  transition:transform .3s cubic-bezier(.2,.8,.2,1)}
.sheet.on{transform:translate(-50%,0)}
.sheet .grip{width:42px;height:4px;border-radius:999px;background:var(--stroke-2);margin:4px auto 16px}
.sheet h3{margin:0 0 16px;font-size:16px;font-weight:750;letter-spacing:-.3px}
.fl{display:grid;gap:7px;margin-bottom:14px}
.fl > span{font-size:11.5px;font-weight:650;color:var(--muted)}
.fl input,.fl select{width:100%;border:1px solid var(--stroke-2);background:rgba(4,6,13,.5);color:var(--text);
  border-radius:13px;padding:0 13px;min-height:46px;font-size:14px;outline:none;appearance:none}
.fl select{background-image:linear-gradient(45deg,transparent 50%,var(--muted) 50%),linear-gradient(135deg,var(--muted) 50%,transparent 50%);
  background-position:calc(100% - 19px) 21px,calc(100% - 14px) 21px;background-size:5px 5px,5px 5px;background-repeat:no-repeat;padding-right:36px}
.fl input:focus,.fl select:focus{border-color:var(--violet);box-shadow:0 0 0 3px rgba(99,102,241,.18)}
.fl input::placeholder{color:var(--faint)}
.seg{display:flex;gap:8px}
.seg label{flex:1 1 0;display:flex;align-items:center;justify-content:center;gap:7px;min-height:46px;
  border:1px solid var(--stroke-2);border-radius:13px;font-size:12.5px;font-weight:650;color:var(--muted);cursor:pointer}
.seg input{width:auto;min-height:0;margin:0;accent-color:var(--violet)}
.seg label:has(input:checked){color:var(--text);border-color:var(--violet);background:rgba(99,102,241,.16)}
.form-actions{display:flex;gap:10px;margin-top:6px}
.form-actions .btn{flex:1 1 0;justify-content:center;min-height:50px;font-size:13.5px}
.err{font-size:11.5px;color:var(--rose);margin-top:-6px;margin-bottom:10px}
.err[hidden]{display:none}

/* Backup rows in sheet */
.bak-row{display:flex;align-items:center;gap:12px;padding:12px 0;border-top:1px solid var(--stroke)}
.bak-row:first-of-type{border-top:none}
.bak-row .txt{flex:1 1 0;min-width:0}
.bak-row .txt b{display:block;font-size:13px;font-weight:700}
.bak-row .txt span{display:block;font-size:11.5px;color:var(--muted);margin-top:2px}

/* Notification items inside sheet */
.notif{display:flex;gap:12px;align-items:flex-start;padding:13px 0;border-top:1px solid var(--stroke)}
.notif:first-of-type{border-top:none}
.notif .dot{width:9px;height:9px;border-radius:50%;margin-top:5px;flex:0 0 auto}
.notif b{display:block;font-size:13px;font-weight:700}
.notif span{display:block;font-size:11.5px;color:var(--muted);margin-top:3px}
.notif .amt{margin-left:auto;font-size:13px;font-weight:750;white-space:nowrap}

/* Lock screen */
.lock{position:fixed;inset:0;z-index:90;background:
  radial-gradient(120% 55% at 8% -5%,rgba(99,102,241,.34),transparent 60%),
  radial-gradient(90% 45% at 100% 0%,rgba(34,211,238,.20),transparent 55%),
  linear-gradient(180deg,#0b1224,#070b16 40%,#04060d);
  display:flex;align-items:center;justify-content:center;padding:24px}
.lock[hidden]{display:none}
.lock-card{width:100%;max-width:300px;text-align:center}
.lock .logo{margin:0 auto 18px;width:54px;height:54px;border-radius:18px}
.lock .logo svg{width:28px;height:28px}
.lock h2{font-size:20px;font-weight:750;letter-spacing:-.3px;margin:0 0 6px}
.lock .sub{font-size:13px;color:var(--muted);margin:0 0 22px;line-height:1.4}
.lock-dots{display:flex;gap:16px;justify-content:center;margin-bottom:24px}
.lock-dots .dot{width:16px;height:16px;border-radius:50%;border:2px solid var(--stroke-2);background:transparent;transition:.15s}
.lock-dots .dot.on{background:var(--violet);border-color:var(--violet);box-shadow:0 0 12px rgba(99,102,241,.7)}
.lock-pad{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;max-width:260px;margin:0 auto}
.lock-pad button{min-height:58px;border-radius:16px;border:1px solid var(--stroke);background:var(--surface);
  color:var(--text);font-size:22px;font-weight:700;backdrop-filter:blur(12px);transition:transform .12s ease,background .15s ease}
.lock-pad button:active{transform:scale(.92);background:var(--surface-2)}
.lock-pad .del{font-size:18px;color:var(--muted)}
.lock .err{margin-top:16px}
.lock .lock-foot{margin-top:18px;font-size:11px;color:var(--faint)}

/* iOS install banner */
.ios-banner{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(var(--nav-h) + var(--safe-b) + 12px);
  width:calc(100% - 40px);max-width:400px;z-index:35;display:none;align-items:center;gap:12px;
  padding:13px 14px;border-radius:18px;background:linear-gradient(160deg,rgba(99,102,241,.28),rgba(34,211,238,.12));
  border:1px solid var(--stroke-2);box-shadow:var(--shadow);backdrop-filter:blur(18px)}
.ios-banner.on{display:flex}
.ios-banner .txt{flex:1 1 0;min-width:0}
.ios-banner b{display:block;font-size:12.5px;font-weight:700}
.ios-banner span{display:block;font-size:11px;color:#cfd4e8;margin-top:3px;line-height:1.4}
.ios-banner .x{border:none;background:transparent;color:var(--muted);min-width:44px;min-height:44px;border-radius:12px;display:grid;place-items:center;flex:0 0 auto}

/* Toast */
.toast{position:fixed;left:50%;transform:translate(-50%,20px);bottom:calc(var(--nav-h) + var(--safe-b) + 24px);
  z-index:60;background:rgba(13,20,37,.96);border:1px solid var(--stroke-2);color:var(--text);font-size:12.5px;
  font-weight:600;padding:12px 18px;border-radius:14px;box-shadow:var(--shadow);opacity:0;visibility:hidden;
  transition:opacity .22s ease,transform .22s ease,visibility .22s ease;max-width:calc(100% - 40px);text-align:center}
.toast.on{opacity:1;visibility:visible;transform:translate(-50%,0)}

@media (prefers-reduced-motion:reduce){
  *:not(.fx-rate),*:not(.fx-rate)::before,*:not(.fx-rate)::after{animation-duration:.001ms !important;animation-iteration-count:1 !important;transition-duration:.001ms !important}
}

  .theme-toggle{width:44px;height:44px;display:flex;align-items:center;justify-content:center;border-radius:14px;border:1px solid var(--stroke);background:var(--surface);color:var(--text);cursor:pointer;font-size:17px;box-shadow:0 8px 20px -14px rgba(34,211,238,.65);transition:transform .15s ease,border-color .15s ease,background .15s ease;backdrop-filter:blur(14px)}
  .theme-toggle:hover{border-color:rgba(34,211,238,.45);background:rgba(255,255,255,.08)}
  .theme-toggle:active{transform:scale(.94)}
  .theme-toggle:focus-visible{outline:2px solid rgba(34,211,238,.65);outline-offset:2px}
  .fx-refresh{
    display:inline-flex;align-items:center;justify-content:center;
    width:16px;height:16px;color:var(--muted);opacity:.75;
  }
  .fx-refresh svg{
    width:16px;height:16px;display:block;fill:none;
    stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round;
    transform-origin:50% 50%;
  }
  .fx-rate:hover .fx-refresh{color:var(--cyan);opacity:1}
  .fx-rate.updating .fx-refresh{color:var(--cyan);opacity:1}
  .fx-rate.updating .fx-refresh svg{animation:fxSpin .65s linear infinite}
  .fx-rate.updated{animation:none}
  .fx-rate.updated .fx-refresh{color:var(--green);opacity:1}
  .fx-rate.updated::after{
    content:"";position:absolute;inset:0;border-radius:inherit;
    background:rgba(34,211,238,.10);animation:fxFlash .8s ease forwards;
    pointer-events:none;
  }
  @keyframes fxSpin{
    from{transform:rotate(0deg)}
    to{transform:rotate(360deg)}
  }
  body.light-theme{--bg:#f4f7fb;--surface:rgba(255,255,255,.88);--surface2:rgba(248,250,252,.96);--stroke:rgba(15,23,42,.10);--text:#172033;--muted:#667085;--cyan:#0891b2;--purple:#6d5dfc;--green:#15803d;--red:#dc2626;--amber:#b45309;background:radial-gradient(900px 500px at 10% -10%,rgba(109,93,252,.10),transparent 60%),radial-gradient(800px 500px at 100% 0%,rgba(8,145,178,.08),transparent 60%),var(--bg)}
  body.light-theme{--faint:#667085;--surface-2:rgba(15,23,42,.05);--stroke-2:rgba(15,23,42,.16)}

  body.light-theme .app::before{display:none}
  body.light-theme .navbar{background:linear-gradient(180deg,rgba(255,255,255,.7),rgba(255,255,255,.96) 45%);border-top-color:var(--stroke)}

  body.light-theme .eyebrow,body.light-theme .count,body.light-theme .ycol.active .ym,body.light-theme .nav-item.active{color:#4f46e5}
  body.light-theme .topbar,body.light-theme .card,body.light-theme .modal,body.light-theme .sheet,body.light-theme .toast,body.light-theme .fx-rate,body.light-theme .theme-toggle{box-shadow:0 10px 30px rgba(15,23,42,.07)}
  body.light-theme .nav{background:rgba(255,255,255,.86);border-top-color:var(--stroke)}
  body.light-theme input,body.light-theme select,body.light-theme textarea{background:rgba(255,255,255,.9);color:var(--text);border-color:var(--stroke)}
  body.light-theme .theme-toggle:hover,body.light-theme .fx-rate:hover{background:rgba(15,23,42,.04)}


  @keyframes fxPulse{0%{transform:scale(1)}45%{transform:scale(1.045)}100%{transform:scale(1)}}
  @keyframes fxFlash{0%{opacity:1}100%{opacity:0}}


/* ---------- Kur butonu: dönen ışık çerçevesi (buton_1.html tarzı) ---------- */
/* Temel .fx-rate kuralları yukarıda tek blokta birleştirildi. */
body.light-theme .fx-rate{--fx-inner:#ffffff}
.fx-rate > *{position:relative;z-index:2}

/* Dönen ışık katmanı: sadece yükleme sırasında görünür */
.fx-rate::before{
  content:""; position:absolute; top:50%; left:50%;
  width:240px; height:240px;
  background:conic-gradient(from 0deg,transparent 20%,#3b82f6,#8b5cf6,#ec4899,transparent 80%);
  transform:translate(-50%,-50%) rotate(0deg);
  opacity:0; pointer-events:none; z-index:0;
}
/* İç gövde: ışığı sadece kenarda (2px) bırakır */
.fx-rate::after{
  content:""; position:absolute; inset:2px; border-radius:9px;
  background:var(--fx-inner); z-index:1;
  opacity:0; pointer-events:none;
}
.fx-rate{-webkit-mask-image:-webkit-radial-gradient(white,black);transform:translateZ(0)}
.fx-rate::before{will-change:transform}
.fx-rate.loading::before{opacity:1; animation:fxBorderRotate 1.5s linear infinite}
.fx-rate.loading::after{opacity:1}

/* Tamamlandı: yeşil ışık bir tur döner, çerçeve yeşil parlar */
.fx-rate.success{border-color:rgba(52,211,153,.75);box-shadow:0 0 18px rgba(52,211,153,.28);animation:none;transform:none}
.fx-rate.success::before{
  opacity:1;
  background:conic-gradient(from 0deg,transparent 20%,#22c55e,#86efac,transparent 80%);
  animation:fxBorderRotate .8s linear 1;
}
.fx-rate.success::after{opacity:1}
@keyframes fxBorderRotate{
  from{transform:translate(-50%,-50%) rotate(0deg)}
  to{transform:translate(-50%,-50%) rotate(360deg)}
}

/* === Gösterge animasyonu === */
.gauge-segment{cursor:pointer;pointer-events:stroke;stroke-width:16;stroke-dasharray:1 1;stroke-dashoffset:1;opacity:1;animation:none;transition:stroke-dashoffset .7s cubic-bezier(.3,.7,.2,1) var(--sd,0ms),opacity .5s,filter .5s,stroke-width .5s;filter:none}
.gauge-svg.drawn .gauge-segment{stroke-dashoffset:0}
.gauge-svg.drawn.has-sel .gauge-segment:not(.is-active){opacity:.5}
.gauge-svg .gauge-segment.is-active{opacity:1;stroke-width:18;filter:drop-shadow(0 0 3px color-mix(in srgb,var(--cat-color) 55%,transparent))}
/* SVG dilimde tarayıcı odak halkası büyük bir kare gibi görünüyordu; tıklama/klavye
   seçimi yine çalışır, görsel geri bildirimi .is-active sağlar. */
.gauge-segment:focus,.gauge-segment:focus-visible,.gauge-svg:focus,.gauge-svg:focus-visible{outline:none}
.gauge-needle{transition:transform 1s cubic-bezier(.4,0,.2,1);filter:drop-shadow(0 2px 5px rgba(0,0,0,.45))}
.gauge-needle .needle-knob{filter:drop-shadow(0 0 2px rgba(165,180,252,.5))}
.gauge-center.pop strong{animation:gPop .45s cubic-bezier(.2,.9,.3,1.3)}
.gauge-center.pop span{animation:gFade .35s both}
@keyframes gPop{0%{transform:scale(.82);opacity:.2}100%{transform:none;opacity:1}}
@keyframes gFade{from{opacity:0;transform:translateY(4px)}to{opacity:1;transform:none}}
body.light-theme .gauge-needle path,body.light-theme .gauge-needle .needle-knob{fill:#1e293b}
/* === Sekme / ay geçişi === */
/* display:flow-root: .monthbar'ın 14px üst boşluğu .view dışına taşmasın.
   Aksi halde Ödemeler sekmesinde .view 86px, diğerlerinde 72px'ten başlıyor
   ve her geçişte grup 14px kayıyordu. */
.view{view-transition-name:page;display:flow-root}
/* Tarayıcının varsayılan grup animasyonu, grup kutusunun YÜKSEKLİĞİNİ ve
   DİKEY KONUMUNU eski anlık görüntüden yenisine morph'lar. Bu, yatay
   kaydırma geçişinin üstüne "kayma" bindiriyordu (ölçüldü: kaydırılmış
   ödemeler sayfasından çıkarken 291px dikey kayma, Ayarlar'a geçişte %123
   yükseklik değişimi). Geçişte yalnızca yatay kaydırma kalsın. */
::view-transition-group(page){animation:none}
::view-transition-old(page){animation:vtOut .22s ease both}
::view-transition-new(page){animation:vtIn .34s cubic-bezier(.2,.8,.2,1) both}
/* Alt bar/menü ve diğer sabit ögeler varsayılan kök geçişiyle görünüp kayboluyordu;
   kök geçişi kapatılır, yalnızca .view (page) animasyonlanır. */
::view-transition-old(root),::view-transition-new(root){animation:none}
@keyframes vtOut{to{opacity:0;transform:translateX(calc(var(--vt-x,26px) * -1))}}
@keyframes vtIn{from{opacity:0;transform:translateX(var(--vt-x,26px))}}
.view.enter{animation:vtIn .34s cubic-bezier(.2,.8,.2,1) both}
@media(prefers-reduced-motion:reduce){.gauge-segment{transition:none;stroke-dashoffset:0}.gauge-needle{transition:none}.gauge-center.pop strong,.gauge-center.pop span{animation:none}::view-transition-old(page),::view-transition-new(page){animation:none}.view.enter{animation:none}}

  function parseAmount(value){
    var input = String(value == null ? "" : value).trim().replace(/\s/g, "");
    if (!input) return NaN;
    if (input.indexOf(",") !== -1){
      if (!/^(?:\d{1,3}(?:\.\d{3})*|\d+),\d{1,2}$/.test(input)) return NaN;
      input = input.replace(/\./g, "").replace(",", ".");
    } else if (!/^\d+(?:\.\d{1,2})?$/.test(input)) {
      return NaN;
    }
    var amount = Number(input);
    return Number.isFinite(amount) && amount > 0 ? Math.round(amount * 100) / 100 : NaN;
  }
  function isValidISODate(value){
    if (!/^\d{4}-\d{2}-\d{2}$/.test(String(value || ""))) return false;
    var parts = value.split("-");
    var date = new Date(+parts[0], +parts[1] - 1, +parts[2]);
    return date.getFullYear() === +parts[0] && date.getMonth() === +parts[1] - 1 && date.getDate() === +parts[2];
  }

  /* ---------- Sesler: dosya yok, Web Audio ile kodla üretilir ---------- */
  var Sound = (function(){
    var ctx = null;
    function ac(){
      if (!ctx){ try { var C = window.AudioContext || window.webkitAudioContext; if (C) ctx = new C(); } catch(e){} }
      if (ctx && ctx.state === "suspended"){ try { ctx.resume(); } catch(e){} }
      return ctx;
    }
    function tone(c, t0, f, dur, type, gain, f2){
      var o = c.createOscillator(), g = c.createGain();
      var vol = settings.volume != null ? settings.volume : 0.6;
      var v = Math.max(0.0001, gain * vol);
      o.type = type || "sine";
      o.frequency.setValueAtTime(f, t0);
      if (f2) o.frequency.exponentialRampToValueAtTime(f2, t0 + dur);
      g.gain.setValueAtTime(0.0001, t0);
      g.gain.exponentialRampToValueAtTime(v, t0 + 0.012);
      g.gain.exponentialRampToValueAtTime(0.0001, t0 + dur);
      o.connect(g); g.connect(c.destination);
      o.start(t0); o.stop(t0 + dur + 0.04);
    }
    var P = {
      pay:    function(c,t){ tone(c,t,659.25,.16,"sine",.34); tone(c,t+.09,987.77,.3,"sine",.34); },
      undo:   function(c,t){ tone(c,t,659.25,.14,"sine",.28); tone(c,t+.09,493.88,.24,"sine",.28); },
      del:    function(c,t){ tone(c,t,220,.22,"triangle",.4,110); },
      add:    function(c,t){ tone(c,t,523.25,.12,"sine",.3); tone(c,t+.07,783.99,.2,"sine",.3); },
      backup: function(c,t){ tone(c,t,523.25,.14,"sine",.28); tone(c,t+.1,659.25,.14,"sine",.28); tone(c,t+.2,783.99,.3,"sine",.28); },
      error:  function(c,t){ tone(c,t,330,.14,"triangle",.36); tone(c,t+.16,262,.24,"triangle",.36); },
      tick:   function(c,t){ tone(c,t,1500,.045,"sine",.16,1100); }
    };
    var V = { pay:[18], del:[30], error:[25,40,25], add:[10] };
    function play(name){
      if (settings.sound === false) return;
      var c = ac();
      if (c && P[name]){ try { P[name](c, c.currentTime + 0.01); } catch(e){} }
      if (navigator.vibrate && V[name]){ try { navigator.vibrate(V[name]); } catch(e){} }
    }
    return { play:play };
  })();

  /* Kur metninin genişliği hiç değişmesin diye her zaman 2 ondalık gösterilir;

  var lastFx = null;

  function loadCachedFx(){

  /* Kur göstergesi Ayarlar'dan kapatılabilir; kapalıyken Binance'e istek gitmez. */
  function applyFxVisibility(){
    var box = document.getElementById("fxRate");
    if (box) box.hidden = settings.fx === false;
  }
  function fmtFx(v){
    return v.toLocaleString("tr-TR", { minimumFractionDigits:2, maximumFractionDigits:2 });
  }
  function renderFX(value, state){
    var box = document.getElementById("fxRate");
    var val = document.getElementById("fxValue");
    if (!box || !val) return;
    box.classList.remove("loading","success");
    if (state === "loading"){
      box.classList.add("loading");
      if (lastFx === null) val.textContent = "—";
      return;
    }
    if (typeof value === "number" && isFinite(value)){
      lastFx = value;
      val.textContent = fmtFx(value);
      return;
    }
    val.textContent = lastFx !== null ? fmtFx(lastFx) : "—";
  }

  function fetchUSDTRY(){
    if (fxUpdating) return;
    fxUpdating = true;
    var seq = ++fxRequestSeq;
    var box = document.getElementById("fxRate");
    var val = document.getElementById("fxValue");
    if (!box || !val){ fxUpdating=false; return; }

    renderFX(null, "loading");
    var started = performance.now();
    var minDuration = 1200;
    var rate = null;
    var failed = false;

    fetch(FX_ENDPOINT, {
      cache:"no-store",
      headers:{ "Accept":"application/json" }
    })
    .then(function(r){
      if (!r.ok) throw new Error("HTTP " + r.status);
      return r.json();
    })
    .then(function(data){
      if (!data || data.symbol !== "USDTTRY" || !data.price) throw new Error("USDTTRY fiyatı bulunamadı");
      rate = Number(data.price);
      if (!isFinite(rate)) throw new Error("Geçersiz fiyat");
    })
    .catch(function(){
      failed = true;
    })
    .finally(function(){
      var wait = Math.max(0, minDuration - (performance.now() - started));
      setTimeout(function(){
        if (seq !== fxRequestSeq) return;
        fxUpdating = false;
        box.classList.remove("loading");
        if (!failed && rate !== null){
          lastFx = rate;
          saveCachedFx(rate);
          val.textContent = fmtFx(rate);
          box.classList.add("success");
          setTimeout(function(){
            if (seq === fxRequestSeq) box.classList.remove("success");
          }, 1200);
        } else {
          val.textContent = lastFx !== null ? fmtFx(lastFx) : "—";
          if (typeof toast === "function") toast("Binance USDT/TRY kuru alınamadı");
        }
      }, wait);
    });
  }

  /* ---------- PIN ---------- */
  function simpleHash(str){
    var h = 5381;
    for (var i=0;i<str.length;i++){ h = ((h<<5)+h) ^ str.charCodeAt(i); }
    return (h >>> 0).toString(16);
  }
  var PIN_SALT_KEY = "odeme-takip-pin-salt";
  var LOCKOUT_KEY = "odeme-takip-lock";
  function pinSet(){ try { return !!localStorage.getItem(PIN_KEY); } catch(e){ return false; } }
  function getPinSalt(){
    try {
      var salt = localStorage.getItem(PIN_SALT_KEY);
      if (salt) return salt;
      var bytes = new Uint8Array(16);
      if (window.crypto && crypto.getRandomValues) crypto.getRandomValues(bytes);
      else for (var i=0;i<bytes.length;i++) bytes[i] = Math.floor(Math.random()*256);
      salt = Array.prototype.map.call(bytes, function(b){ return ("0"+b.toString(16)).slice(-2); }).join("");
      localStorage.setItem(PIN_SALT_KEY, salt);
      return salt;
    } catch(e){ return "nosalt"; }
  }
  /* PIN, tuzlu SHA-256 ile saklanır (WebCrypto yoksa tuzlu basit hash'e düşer). */
  function hashPin(pin, salt){
    if (window.crypto && crypto.subtle && window.TextEncoder){
      return crypto.subtle.digest("SHA-256", new TextEncoder().encode(salt + ":" + pin)).then(function(buf){
        return Array.prototype.map.call(new Uint8Array(buf), function(b){ return ("0"+b.toString(16)).slice(-2); }).join("");
      }).catch(function(){ return "fb" + simpleHash(salt + ":" + pin); });
    }
    return Promise.resolve("fb" + simpleHash(salt + ":" + pin));
  }
  function setPin(pin){
    return hashPin(pin, getPinSalt()).then(function(h){
      try { localStorage.setItem(PIN_KEY, "v2:" + h); } catch(e){}
    });
  }
  function clearPin(){ try { localStorage.removeItem(PIN_KEY); localStorage.removeItem(LOCKOUT_KEY); } catch(e){} }
  /* { ok, upgrade } döner; upgrade = eski zayıf hash ile giriş yapıldı, güçlü formata taşınmalı. */
  function verifyPin(pin){
    var stored = null;
    try { stored = localStorage.getItem(PIN_KEY); } catch(e){}
    if (!stored) return Promise.resolve({ ok:false, upgrade:false });
    if (stored.indexOf("v2:") === 0){
      return hashPin(pin, getPinSalt()).then(function(h){ return { ok: stored === "v2:" + h, upgrade:false }; });
    }
    var legacyOk = stored === simpleHash(pin);
    return Promise.resolve({ ok:legacyOk, upgrade:legacyOk });
  }

  var lockMode = "", lockPin = "", lockFirstPin = "", lockAttempts = 0, lockLockUntil = 0, appStarted = false;

  function showLock(mode){
    lockMode = mode; lockPin = ""; lockFirstPin = ""; lockAttempts = 0;
    if (mode === "login"){
      /* Kalıcı kilitleme: yanlış denemeler sayfa yenilense de hatırlanır. */
      try { lockLockUntil = +localStorage.getItem(LOCKOUT_KEY) || 0; } catch(e){ lockLockUntil = 0; }
    } else {
      lockLockUntil = 0;
    }
    var lock = document.getElementById("lock");
    lock.hidden = false;
    updateLockUI();
  }
  function hideLock(){ document.getElementById("lock").hidden = true; }
  function renderLockDots(){
    var el = document.getElementById("lockDots"), html = "";
    for (var i=0;i<4;i++){ html += '<span class="dot' + (i<lockPin.length?" on":"") + '"></span>'; }
    el.innerHTML = html;
  }
  function updateLockUI(){
    var title = document.getElementById("lockTitle");
    var sub = document.getElementById("lockSub");
    var foot = document.getElementById("lockFoot");
    var pad = document.getElementById("lockPad");
    var now = Date.now();
    if (lockMode === "login"){
      title.textContent = "PIN Girişi";
      sub.textContent = "Ödeme takibini açmak için PIN girin";
      foot.textContent = "";
    } else if (lockMode === "setup"){
      title.textContent = "PIN Belirle";
      sub.textContent = "Uygulamayı sadece sen kullan — 4 haneli PIN belirle";
      foot.textContent = "PIN'i unutma; sıfırlamak verileri siler.";
    } else if (lockMode === "confirm"){
      title.textContent = "PIN Onayla";
      sub.textContent = "Aynı PIN'i tekrar gir";
      foot.textContent = "";
    }
    if (lockMode === "login" && lockLockUntil > now){
      var secs = Math.ceil((lockLockUntil - now)/1000);
      sub.textContent = "Çok fazla deneme. " + secs + " sn bekleyin.";
      pad.style.opacity = .35; pad.style.pointerEvents = "none";
    } else {
      pad.style.opacity = 1; pad.style.pointerEvents = "";
    }
    renderLockDots();
  }
  function lockPress(d){
    if (lockMode === "login" && lockLockUntil > Date.now()) return;
    if (d === "clr"){ lockPin = ""; renderLockDots(); return; }
    if (d === "del"){ lockPin = lockPin.slice(0,-1); renderLockDots(); return; }
    if (lockPin.length >= 4) return;
    lockPin += d;
    renderLockDots();
    if (lockPin.length === 4) setTimeout(lockSubmit, 130);
  }
  function lockSubmit(){
    var err = document.getElementById("lockErr");
    err.hidden = true;
    if (lockMode === "login"){
      verifyPin(lockPin).then(function(res){
        if (res.ok){
          /* Eski zayıf hash ile giriş yapıldıysa ilk fırsatta güçlü formata taşı. */
          if (res.upgrade) setPin(lockPin);
          lockLockUntil = 0;
          try { localStorage.removeItem(LOCKOUT_KEY); } catch(e){}
          hideLock(); startApp();
        } else {
          lockAttempts++; lockPin = ""; renderLockDots();
          if (lockAttempts >= 3){
            lockLockUntil = Date.now() + 30000; lockAttempts = 0;
            /* Kilitleme durumunu sakla: sayfa yenilenerek aşılamasın. */
            try { localStorage.setItem(LOCKOUT_KEY, String(lockLockUntil)); } catch(e){}
            err.textContent = "3 yanlış deneme. 30 saniye bekleyin.";
          } else {
            err.textContent = "Yanlış PIN. Kalan deneme: " + (3 - lockAttempts);
          }
          err.hidden = false; updateLockUI();
        }
      });
    } else if (lockMode === "setup"){
      lockFirstPin = lockPin; lockPin = ""; lockMode = "confirm"; updateLockUI();
    } else if (lockMode === "confirm"){
      if (lockPin === lockFirstPin){
        setPin(lockPin).then(function(){
          lockPin = ""; hideLock();
          if (!appStarted){ startApp(); toast("PIN belirlendi"); }
          else { toast("PIN belirlendi"); render(); }
        });
      } else {
        lockPin = ""; lockMode = "setup"; updateLockUI();
        err.textContent = "PIN'ler eşleşmedi. Tekrar belirle."; err.hidden = false;
      }
    }
  }
  document.getElementById("lockPad").addEventListener("click", function(e){

  /* ---------- IndexedDB backups ---------- */
  function withIDB(cb, errCb){
    if (!("indexedDB" in window)){ if(errCb) errCb(); return; }
    try {
      var req = indexedDB.open(BACKUP_DB, 1);
      req.onupgradeneeded = function(){ req.result.createObjectStore(BACKUP_STORE, { keyPath:"ts" }); };
      req.onsuccess = function(){ cb(req.result); };
      req.onerror = function(){ if(errCb) errCb(); };
    } catch(e){ if(errCb) errCb(); }
  }
  function saveBackupSnapshot(timestamp){
    var ts = Number(timestamp) || Date.now();
    return new Promise(function(resolve, reject){
      withIDB(function(db){
        var snap = { ts: ts, date: new Date(ts).toISOString(), payments: JSON.parse(JSON.stringify(payments)), count: payments.length };
        var tx;
        try {
          tx = db.transaction(BACKUP_STORE, "readwrite");
          tx.objectStore(BACKUP_STORE).put(snap);
          tx.oncomplete = function(){
            try {
              var trimTx = db.transaction(BACKUP_STORE, "readwrite");
              var req = trimTx.objectStore(BACKUP_STORE).getAll();
              req.onsuccess = function(){
                var all = req.result.sort(function(a,b){ return a.ts - b.ts; });
                all.slice(0, Math.max(0, all.length - MAX_BACKUPS)).forEach(function(old){
                  trimTx.objectStore(BACKUP_STORE).delete(old.ts);
                });
              };
              trimTx.oncomplete = function(){ resolve(snap); };
              trimTx.onerror = function(){ resolve(snap); };
            } catch(e){ resolve(snap); }
          };
          tx.onerror = function(){ reject(tx.error || new Error("Yedek veritabanına yazılamadı")); };
          tx.onabort = function(){ reject(tx.error || new Error("Yedek işlemi iptal edildi")); };
        } catch(e){ reject(e); }
      }, function(){ reject(new Error("Bu tarayıcıda cihaz içi yedekleme kullanılamıyor")); });
    });
  }
  function listBackups(cb){
    withIDB(function(db){
      var tx = db.transaction(BACKUP_STORE, "readonly");
      tx.objectStore(BACKUP_STORE).getAll().onsuccess = function(e){
        cb(e.target.result.sort(function(a,b){ return b.ts - a.ts; }));
      };
    }, function(){ cb([]); });
  }

  /* ---------- Hareket yardımcıları ---------- */
  var lastRing = null, lastNums = {};
  var TAB_ORDER = ["pay","sum","year","all","set"];
  function systemReducesMotion(){
    try { return window.matchMedia("(prefers-reduced-motion: reduce)").matches; } catch(e){ return false; }
  }
  function prefersReduced(){
    if (settings.motion === "on") return false;
    return systemReducesMotion();
  }
  /* "Animasyonlar: Her zaman açık" seçilince CSS'teki prefers-reduced-motion bloklarını devre dışı bırakır */
  var motionRules = null;
  function applyMotionSetting(){
    try {
      if (!motionRules){
        motionRules = [];
        Array.prototype.forEach.call(document.styleSheets, function(sh){
          var rules; try { rules = sh.cssRules; } catch(e){ return; }
          Array.prototype.forEach.call(rules, function(r){
            if (r.media && /prefers-reduced-motion/.test(r.media.mediaText)) motionRules.push({ rule:r, orig:r.media.mediaText });
          });
        });
      }
      var force = settings.motion === "on";
      motionRules.forEach(function(m){ m.rule.media.mediaText = force ? "not all" : m.orig; });
    } catch(e){}
  }
  /* Sayılar eski değerinden yenisine sayarak geçer */
  function animateNumbers(){
    var els = view.querySelectorAll("[data-num]");
    var reduce = prefersReduced();
    Array.prototype.forEach.call(els, function(el){
      var to = Number(el.getAttribute("data-num")) || 0;
      var key = el.getAttribute("data-key") || "";
      var from = (key && lastNums[key] !== undefined) ? lastNums[key] : 0;
      if (key) lastNums[key] = to;
      if (reduce || from === to) return;
      var pctMode = el.getAttribute("data-fmt") === "pct";
      var finalText = el.textContent;
      var fmt = function(v){ return pctMode ? v + "%" : tl(v); };
      el.textContent = fmt(from);
      var t0 = null, dur = 650;
      function step(ts){
        if (t0 === null) t0 = ts;
        var k = Math.min(1, (ts - t0) / dur);
        var e = 1 - Math.pow(1 - k, 3);
        el.textContent = k >= 1 ? finalText : fmt(Math.round(from + (to - from) * e));
        if (k < 1) requestAnimationFrame(step);
      }
      requestAnimationFrame(step);
    });
  }
  /* Halka eski yüzdesinden yenisine akar */
  function animateRing(){
    var arc = document.getElementById("ringArc");

  /* Sekme / ay geçişi: View Transitions varsa onu, yoksa CSS giriş animasyonunu kullanır */
  var pendingRiseSuppress = false;
  function go(fn, dir){
    var root = document.documentElement;
    root.style.setProperty("--vt-x", (dir < 0 ? -26 : 26) + "px");
    /* Kartların "yukarıdan yüksel" animasyonu geçişle üst üste binmesin diye bu render'da
       kapatılır. Sınıf üretilen listeye konur; sonradan kaldırılan global bir sınıf
       kullanılmaz (yoksa geçiş bittikten sonra animasyon baştan oynuyordu). */
    pendingRiseSuppress = true;
    if (document.startViewTransition && !prefersReduced()){
      try {
        var vt = document.startViewTransition(function(){ fn(); });
        /* Hızlı ardışık geçişlerde önceki geçiş iptal edilir; sözü sessizce yut. */
        if (vt){ if (vt.ready && vt.ready.catch) vt.ready.catch(function(){}); if (vt.finished && vt.finished.catch) vt.finished.catch(function(){}); }
        return;
      } catch(e){}
    }
    fn();
    if (!prefersReduced()){
      view.classList.remove("enter");
      void view.offsetWidth;
      view.classList.add("enter");
    }
  }

  function changeMonth(delta){

  /* ---------- Referans tasarimli, animasyonlu yari daire kategori gostergesi ---------- */
  /* Referans dosyadaki speedometer geometrisi ve animasyonu; uygulama verilerine uyarlanmıştır. */
  function donutHTML(rows, total){
    var colors = rows.slice(0,8), n = Math.max(colors.length,1);
    var cx=100, cy=100, radius=80;
    function polar(x,y,r,a){ var rad=(a-90)*Math.PI/180; return [x+r*Math.cos(rad),y+r*Math.sin(rad)]; }
    function describeArc(x,y,r,startAngle,endAngle){
      var start=polar(x,y,r,endAngle), end=polar(x,y,r,startAngle);
      var sweep=endAngle-startAngle<=180?'0':'1';
      return 'M '+start[0].toFixed(2)+' '+start[1].toFixed(2)+' A '+r+' '+r+' 0 '+sweep+' 0 '+end[0].toFixed(2)+' '+end[1].toFixed(2);
    }
    var paths='', buttons='', currentAngle=-90;
    colors.forEach(function(r,i){
      var share=total>0?Math.max(0,Number(r.value)||0)/total:1/n;
      var span=share*180, endAngle=currentAngle+span, mid=currentAngle+span/2;
      var pc=total?Math.round((Number(r.value)||0)/total*100):0;
      var gap = span > 7 ? 1.6 : (span > 3 ? 0.6 : 0);
      paths += '<path class="gauge-segment" data-k="'+r.k+'" pathLength="1" d="'+describeArc(cx,cy,radius,currentAngle+gap,endAngle-gap)+'" stroke="'+r.color+'" stroke-width="16" stroke-linecap="butt" fill="none" style="--cat-color:'+r.color+';--sd:'+(i*110)+'ms" tabindex="0" role="button" aria-label="'+esc(r.label)+' '+pc+'%"/>';
      buttons += '<button type="button" class="gauge-cat" data-k="'+r.k+'" data-angle="'+mid.toFixed(3)+'" data-l="'+esc(r.label)+'" data-v="'+esc(tl(r.value))+'" data-p="'+pc+'%" style="--cat-color:'+r.color+'"><i></i><span>'+esc(r.label)+'</span><b>'+pc+'%</b></button>';
      currentAngle=endAngle;
    });
    var first=colors[0], initial=-90;
    if(first){ var firstShare=total>0?(Number(first.value)||0)/total:1/n; initial=-90+(firstShare*180)/2; }
    return '<div class="donut gauge-wrap" id="donut" data-total="'+total+'" data-sel="'+(first?first.k:'')+'">'
      +'<svg class="gauge-svg" viewBox="0 0 200 110" role="group" aria-label="Kategori harcama göstergesi"><path class="gauge-track" d="M 20 100 A 80 80 0 0 1 180 100" fill="none" stroke="var(--stroke)" stroke-width="16" stroke-linecap="butt"/>'+paths
      +'<g class="gauge-needle" id="gaugeNeedle" data-target="'+initial+'" style="transform:rotate(-90deg)"><path d="M 98.2 100 L 100 40 L 101.8 100 Z" fill="#fff"/><circle class="needle-knob" cx="100" cy="100" r="8.5" fill="#fff"/><circle cx="100" cy="100" r="3.2" fill="#6366f1"/></g></svg>'
      +'<div class="gauge-center"><span id="dnL">'+(first?esc(first.label):'Toplam')+'</span><strong id="dnV">'+(first?tl(first.value):tl(total))+'</strong><small id="dnP">'+(first&&total?Math.round(first.value/total*100):100)+'% toplam</small></div>'
      +'<div class="gauge-cats">'+buttons+'</div></div>';
  }

  function selectDonut(k){
    var d=document.getElementById('donut'); if(!d)return;

    var arcNodes=d.querySelectorAll('.gauge-segment[data-k]'); Array.prototype.forEach.call(arcNodes,function(x){x.classList.toggle('is-active',x.getAttribute('data-k')===k);});
    var rowsEl=view.querySelectorAll('.cat-row[data-k]'); Array.prototype.forEach.call(rowsEl,function(x){x.classList.toggle('sel',x.getAttribute('data-k')===k);});
    var gsvg=d.querySelector('.gauge-svg'); if(gsvg) gsvg.classList.add('has-sel');
    var needle=document.getElementById('gaugeNeedle');
    if(needle){ needle.style.transform='rotate('+Number(seg.getAttribute('data-angle')||0)+'deg)'; }

  function viewSummary(){
    var inMonth = payments.filter(sameMonth);
    var total = sum(inMonth);
    var paid = sum(inMonth, function(p){ return p.status==="done" ? p.amount : 0; });
    var wait = sum(inMonth, function(p){ return p.status==="wait" ? p.amount : 0; });
    var late = sum(inMonth, function(p){ return p.status==="late" ? p.amount : 0; });
    var paidPct = total ? Math.round(paid/total*100) : 0;
    var waitPct = total ? Math.round(wait/total*100) : 0;
    var latePct = total ? Math.max(0, 100 - paidPct - waitPct) : 0;

    var rows = CAT_ORDER.map(function(k){
      return { k:k, label:CATS[k].label, color:CATS[k].color, value:sum(inMonth, function(p){ return p.cat===k ? p.amount : 0; }) };
    }).filter(function(r){ return r.value > 0; }).sort(function(a,b){ return b.value - a.value; });
    var top = rows[0];

    var html = '<div class="page">'
      + '<div class="monthbar" id="monthbar">'
      + '<button class="m-btn" id="prevMonth" type="button" aria-label="Önceki ay"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m15 18-6-6 6-6"/></svg></button>'
      + '<div class="m-label"><b>' + MONTHS[month] + " " + year + '</b><span id="todayLabel"></span></div>'
      + '<button class="m-btn" id="nextMonth" type="button" aria-label="Sonraki ay"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m9 18 6-6-6-6"/></svg></button>'
      + '</div>'
      + swipeHintHTML()
      + '<div class="sec-head" style="margin-top:20px"><h2>Özet</h2><span class="count" data-num="' + total + '" data-key="s-total">' + tl(total) + '</span></div>'
      + '<div class="card category-overview"><h3>Kategori Dağılımı</h3>'
      + (rows.length ? '<div class="donut-wrap">' + donutHTML(rows, total) + '</div><div class="subbox" id="subBox" hidden></div>' : '')
      + '<div class="category-chart">';
    if (!rows.length){
      html += '<p class="hint" style="text-align:center">Bu ay için kayıt yok.</p>';
    }
    rows.forEach(function(r){
      var p = total ? Math.round(r.value/total*100) : 0;
      html += '<div class="cat-row" data-k="' + r.k + '" role="button" tabindex="0" style="--cat-color:' + r.color + '"><div class="cat-top"><div class="cat-name"><i class="dot" style="background:' + r.color + '"></i>'
        + '<span class="nm">' + esc(r.label) + '</span></div>'
        + '<div class="cat-value"><span class="vl">' + tl(r.value) + '</span><span class="pc">' + p + '%</span></div></div>'
        + '<div class="cat-bar"><span style="width:' + p + '%;background:' + r.color + '"></span></div></div>';
    });
    html += '</div></div>';

    html += '<div class="card"><h3>Ödenen / Bekleyen</h3>'
      + '<div class="bar-track">'
      + '<span style="width:' + paidPct + '%;background:#34d399"></span>'
      + '<span style="width:' + waitPct + '%;background:#fbbf24"></span>'
      + '<span style="width:' + latePct + '%;background:#fb7185"></span>'
      + '</div>'
      + '<div class="ratio">'
      + '<div><span class="k">Ödenen</span><b class="od-nowrap">' + tl(paid) + '</b></div>'
      + '<div><span class="k">Bekleyen</span><b class="od-nowrap">' + tl(wait) + '</b></div>'
      + '<div><span class="k">Gecikmiş</span><b class="od-nowrap">' + tl(late) + '</b></div>'
      + '</div></div>';

    html += '<div class="card"><h3>En Yüksek Harcama</h3>'
      + (top ? '<div class="kv"><span class="k">Kategori</span><span class="v">' + esc(top.label) + '</span></div>'
              + '<div class="kv"><span class="k">Tutar</span><span class="v od-nowrap">' + tl(top.value) + '</span></div>'
              + '<div class="kv"><span class="k">Payı</span><span class="v">' + (total ? Math.round(top.value/total*100) : 0) + '%</span></div>'
            : '<div class="kv"><span class="k">Bu ay için kayıt yok</span></div>')
      + '</div>';

    html += '<div class="card"><h3>Ödeme Durumu</h3>'
      + '<div class="kv"><span class="k">Tamamlanma oranı</span><span class="v">' + paidPct + '%</span></div>'
      + '<div class="kv"><span class="k">Toplam kayıt</span><span class="v">' + inMonth.length + '</span></div>'
      + '<div class="kv"><span class="k">Gecikmiş kayıt</span><span class="v">' + inMonth.filter(function(p){ return p.status==="late"; }).length + '</span></div>'
      + '</div></div>';
    return html;
  }

  function viewYear(){
    var data = MONTHS_SHORT.map(function(m,i){
      var items = payments.filter(function(p){ var d=parseISO(p.due); return d.getFullYear()===year && d.getMonth()===i; });
      return { i:i, total: sum(items), count: items.length };
    });
    var max = Math.max.apply(null, data.map(function(d){ return d.total; }).concat([1]));
    var yTotal = sum(data, function(d){ return d.total; });
    var best = data.slice().sort(function(a,b){ return b.total-a.total; })[0];
    var yearRows = CAT_ORDER.map(function(k){
      return { k:k, label:CATS[k].label, color:CATS[k].color, value:sum(payments, function(p){
        return parseISO(p.due).getFullYear()===year && p.cat===k ? p.amount : 0;
      }) };
    }).filter(function(r){ return r.value > 0; }).sort(function(a,b){ return b.value-a.value; });

    var html = '<div class="page">'
      + '<div class="sec-head" style="margin-top:4px"><h2>Yıllık · ' + year + '</h2><span class="count od-nowrap">' + tl(yTotal) + '</span></div>'
      + '<div class="card"><h3>Aylık Toplam</h3><div class="chart">';
    data.forEach(function(d){
      var h = d.total ? Math.max(6, Math.round(d.total/max*100)) : 3;
      html += '<button class="ycol' + (d.i===month ? " active" : "") + '" data-month="' + d.i + '" type="button" aria-label="' + MONTHS[d.i] + ' ' + year + '">'
        + '<span class="yval" title="' + tl(d.total) + '">' + (d.total ? compactTL(d.total) : "") + '</span>'
        + '<span class="ytrack"><span class="yfill" style="height:' + h + '%;--d:' + (d.i * 45) + 'ms"></span></span>'
        + '<span class="ym">' + MONTHS_SHORT[d.i] + '</span>'
        + '</button>';
    });
    html += '</div></div>';

    html += '<div class="card category-overview"><h3>Kategori Dağılımı · ' + year + '</h3>' + (yearRows.length ? '<div class="donut-wrap">' + donutHTML(yearRows, yTotal) + '</div><div class="subbox" id="subBox" hidden></div>' : '') + '<div class="category-chart">';
    if (!yearRows.length){
      html += '<p class="hint" style="text-align:center">Bu yıl için kayıt yok.</p>';
    }
    yearRows.forEach(function(r){
      var p = yTotal ? Math.round(r.value/yTotal*100) : 0;
      html += '<div class="cat-row" data-k="' + r.k + '" role="button" tabindex="0" style="--cat-color:' + r.color + '"><div class="cat-top"><div class="cat-name"><i class="dot" style="background:' + r.color + '"></i>'
        + '<span class="nm">' + esc(r.label) + '</span></div>'
        + '<div class="cat-value"><span class="vl">' + tl(r.value) + '</span><span class="pc">' + p + '%</span></div></div>'
        + '<div class="cat-bar"><span style="width:' + p + '%;background:' + r.color + '"></span></div></div>';
    });
    html += '</div></div>';

    html += '<div class="card"><h3>Yıl Özeti</h3>'
      + '<div class="kv"><span class="k">Yıllık toplam</span><span class="v od-nowrap">' + tl(yTotal) + '</span></div>'
      + '<div class="kv"><span class="k">Kayıt sayısı</span><span class="v">' + payments.filter(function(p){ return parseISO(p.due).getFullYear()===year; }).length + '</span></div>'
      + '<div class="kv"><span class="k">En yüksek ay</span><span class="v">' + (best && best.total ? MONTHS[best.i] + " · " + tl(best.total) : "—") + '</span></div>'
      + '<div class="kv"><span class="k">Ortalama (dolu ay)</span><span class="v od-nowrap">' + tl(Math.round(yTotal/Math.max(1, data.filter(function(d){ return d.total>0; }).length))) + '</span></div>'
      + '</div>'
      + '<p class="hint">Aya dokunarak o ayın ödemelerine geçebilirsin.</p>'
      + '</div>';
    return html;
  }

  function notifPermissionLabel(){
    if (!("Notification" in window)) return "Desteklenmiyor";
    return { "granted":"Açık", "denied":"Reddedildi", "default":"Kapalı" }[Notification.permission] || "Kapalı";
  }

  function viewAllTime(){
    var rows = payments.slice().sort(function(a,b){ return parseISO(a.due)-parseISO(b.due); });
    var total = sum(rows);
    var paid = sum(rows, function(p){ return p.status==="done" ? p.amount : 0; });
    var waiting = sum(rows, function(p){ return p.status==="wait" ? p.amount : 0; });
    var late = sum(rows, function(p){ return p.status==="late" ? p.amount : 0; });

    var html = '<div class="page">'
      + '<div class="sec-head" style="margin-top:4px"><h2>Tüm Zamanlar</h2><span class="count">' + rows.length + ' kayıt</span></div>';

    html += '<div class="card">'
      + '<h3>Genel Toplam</h3>'
      + '<div class="kv"><span class="k">Toplam gider</span><span class="v od-nowrap">' + tl(total) + '</span></div>'
      + '<div class="kv"><span class="k">Toplam ödenen</span><span class="v od-nowrap" style="color:var(--green)">' + tl(paid) + '</span></div>'
      + '<div class="kv"><span class="k">Toplam bekleyen</span><span class="v od-nowrap" style="color:var(--amber)">' + tl(waiting) + '</span></div>'
      + '<div class="kv"><span class="k">Toplam gecikmiş</span><span class="v od-nowrap" style="color:var(--rose)">' + tl(late) + '</span></div>'
      + '<div class="kv"><span class="k">Toplam kayıt</span><span class="v">' + rows.length + '</span></div>'
      + '</div>';

    var cats = CAT_ORDER.map(function(k){
      return {
        k:k,
        label:CATS[k].label,
        color:CATS[k].color,
        value:sum(rows, function(p){ return p.cat===k ? p.amount : 0; }),
        count:rows.filter(function(p){ return p.cat===k; }).length
      };
    }).filter(function(r){ return r.value > 0; }).sort(function(a,b){ return b.value-a.value; });

    html += '<div class="card"><h3>Kategori Toplamları</h3><div class="category-chart alltime-category-bars">';
    cats.forEach(function(r){
      var pct = total ? Math.round(r.value/total*100) : 0;
      html += '<div class="cat-row alltime-cat-row" style="--cat-color:' + r.color + '">'
        + '<div class="alltime-cat-head"><div class="alltime-cat-name"><i class="dot" style="background:' + r.color + '"></i>' + esc(r.label) + '</div>'
        + '<div><div class="alltime-cat-amount">' + tl(r.value) + '</div><div class="alltime-cat-meta">' + r.count + ' kayıt · ' + pct + '%</div></div></div>'
        + '<div class="alltime-track"><span style="width:' + pct + '%;background:' + r.color + '"></span></div></div>';
    });
    html += '</div></div>';

    var billItems = rows.filter(function(p){ return p.cat === "fatura"; });
    if (billItems.length){
      html += '<div class="card"><h3>Fatura Türleri</h3><div class="subbox show static">' + billBreakdownHTML(billItems) + '</div></div>';
    }

    var years = {};
    rows.forEach(function(p){
      var d = parseISO(p.due), y = d.getFullYear(), m = d.getMonth();
      if (!years[y]) years[y] = {total:0,count:0,months:Array.from({length:12},function(){return {total:0,count:0};})};
      years[y].total += Number(p.amount)||0;
      years[y].count++;
      years[y].months[m].total += Number(p.amount)||0;
      years[y].months[m].count++;
    });

    var yearKeys = Object.keys(years).map(Number).sort(function(a,b){ return b-a; });
    yearKeys.forEach(function(y){
      var yr = years[y];
      html += '<div class="card"><h3>' + y + ' <span style="float:right;color:var(--text)">' + tl(yr.total) + '</span></h3>';
      yr.months.forEach(function(m,i){
        if (!m.count) return;
        html += '<div class="kv"><span class="k">' + MONTHS[i] + ' · ' + m.count + ' kayıt</span>'
          + '<span class="v od-nowrap">' + tl(m.total) + '</span></div>';
      });
      html += '<div class="kv"><span class="k">Yıl toplamı</span><span class="v od-nowrap">' + tl(yr.total) + '</span></div>';
      html += '</div>';
    });

    html += '<p class="hint">Tüm toplamlar uygulamadaki gerçek ödeme kayıtlarından dinamik olarak hesaplanır.</p></div>';
    return html;
  }

  function attachMonthSwipe(){
    var mb = document.getElementById("monthbar");
    if (!mb || mb._swipe) return;
    mb._swipe = true;
    var sx=0, sy=0, active=false;
    mb.addEventListener("touchstart", function(e){ var t=e.touches[0]; sx=t.clientX; sy=t.clientY; active=true; }, {passive:true});
    mb.addEventListener("touchend", function(e){
      if (!active) return; active=false;
      var t=e.changedTouches[0];
      var dx=t.clientX-sx, dy=t.clientY-sy;
      if (Math.abs(dx) > 50 && Math.abs(dx) > Math.abs(dy)*1.4){
        changeMonth(dx < 0 ? 1 : -1);
      }
    }, {passive:true});
  }

  /* ---------- Actions ---------- */
  function nextMonthDue(iso, anchorDay){
    var d = parseISO(iso), m = d.getMonth()+1, y = d.getFullYear();
    if (m > 11){ m = 0; y += 1; }
    /* anchorDay = ödemenin orijinal vade günü (örn. 31). Kısa ayda kırpılan gün
       uzun aya dönünce geri kazanılır; böylece ay sonu ödemesi 28'e sabitlenmez. */
    var day = Math.min(Number(anchorDay) || d.getDate(), new Date(y, m+1, 0).getDate());
    return y + "-" + pad(m+1) + "-" + pad(day);
  }

  function handleAction(act, id){
    var p = byId(id);
    if (!p) return;
    if (act === "pay"){
      p.status = "done";
      if (p.repeat === "monthly"){
        var anchor = p.dueDay || parseISO(p.due).getDate();
        var due = nextMonthDue(p.due, anchor);
        var dup = payments.some(function(x){
          return x.cat===p.cat && x.due===due && x.amount===p.amount && x.note===(p.note || "") && x.sub===(p.sub || "");
        });
        if (!dup){
          /* autoFrom: bu kopyanın hangi ödemeden otomatik türediği; "geri al" bunu kaldırır. */
          payments.push({ id:Date.now(), cat:p.cat, amount:p.amount, due:due, status:"wait", note:p.note || "", sub:p.sub || "", repeat:"monthly", dueDay:anchor, autoFrom:p.id });
        }
      }
      save(); render(); toast("Ödendi olarak işaretlendi"); Sound.play("pay");
    } else if (act === "undo"){
      p.status = "wait";
      if (parseISO(p.due) < todayMid()) p.status = "late";
      if (p.repeat === "monthly"){
        /* "Ödendi" işaretlenince otomatik oluşturulan sonraki ay kopyası, kullanıcı
           elle değiştirmediyse (vade aynı ve hâlâ bekliyorsa) geri almayla kaldırılır. */
        var nextDue = nextMonthDue(p.due, p.dueDay);
        payments = payments.filter(function(x){
          return !(x.autoFrom === p.id && x.status === "wait" && x.due === nextDue);
        });
      }
      save(); render(); toast("Geri alındı"); Sound.play("undo");
    } else if (act === "postpone"){
      var d = parseISO(p.due); d.setDate(d.getDate()+7);
      p.due = d.getFullYear() + "-" + pad(d.getMonth()+1) + "-" + pad(d.getDate());
      if (p.status === "late" && d >= todayMid()) p.status = "wait";
      save(); render(); toast("Vade 7 gün ertelendi"); Sound.play("tick");
    } else if (act === "edit"){
      openSheet("edit", id);
    } else if (act === "del"){
      if (!confirm("Bu ödeme silinsin mi?\n" + (CATS[p.cat] ? CATS[p.cat].label : "Ödeme") + " · " + tl(p.amount) + " · " + dayLabel(p.due))) return;
      payments = payments.filter(function(x){ return x.id !== id; });
      save(); render(); toast("Ödeme silindi"); Sound.play("del");
    }
  }
